<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A234B">
<title>Super Admin — UltraAccounting</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--navy:#0A234B;--navy2:#071a3a;--navy3:#12356e;--cyan:#01C3FF;--light:#EEF4FD;--green:#0E8A3E;--red:#C62828;--amber:#E69A1F;--grey:#64748b;--bg:#f2f5fb;--line:#e3e9f3;--ink:#0f1b2e;
--sh:0 1px 2px rgba(10,35,75,.05),0 10px 30px -14px rgba(10,35,75,.18)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 Inter,"Segoe UI","Nirmala UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;
 background:radial-gradient(900px 500px at 10% 0%,rgba(1,195,255,.28),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(1,195,255,.18),transparent 60%),linear-gradient(160deg,var(--navy2),var(--navy3))}
.hero h2{font-size:34px;line-height:1.15;margin:18px 0 10px;font-weight:800;letter-spacing:-.5px}
.hero p{opacity:.8;max-width:420px;margin:0 0 22px}
.hero ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.hero li{display:flex;gap:12px;align-items:center;opacity:.92}
.hero li i{font-style:normal;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;backdrop-filter:blur(4px)}
.logo{width:64px;height:64px}
.formside{display:grid;place-items:center;padding:24px;background:#fff}
.box{width:100%;max-width:380px}
.box h1{font-size:26px;margin:0 0 4px;color:var(--navy);font-weight:800;letter-spacing:-.4px}
.box .sub{color:var(--grey);margin:0 0 22px}
.box label{display:block;font-weight:600;font-size:13px;margin-top:14px;color:var(--navy)}
.box input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;margin-top:6px;background:#fafcff;transition:.15s}
.box input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(1,195,255,.15);background:#fff;outline:0}
.box .go{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--navy3),var(--navy));color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(10,35,75,.6);transition:.15s}
.box .go:hover{transform:translateY(-1px)}
.box .go[disabled]{opacity:.6}
.err{color:var(--red);font-weight:600;min-height:20px;margin-top:12px;font-size:13px}

/* ---------- App shell ---------- */
header.bar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 18px -8px rgba(0,0,0,.5)}
header.bar .t{display:flex;align-items:center;gap:12px}
header.bar .t svg{width:38px;height:38px}
header.bar h1{margin:0;font-size:17px;line-height:1.2}
header.bar small{opacity:.7;font-size:12px}
header.bar .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrap{max-width:1280px;margin:0 auto;padding:22px}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:13.5px;white-space:nowrap;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12)}
.btn:active{transform:none}
.btn.g{background:linear-gradient(135deg,#12a150,var(--green))}
.btn.r{background:linear-gradient(135deg,#e04848,var(--red))}
.btn.o{background:linear-gradient(135deg,#f4b24a,var(--amber));color:#2a1a00}
.btn.l{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btn.s{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;border-radius:16px;color:#fff;padding:18px;box-shadow:var(--sh);transition:.2s}
.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:12.5px;opacity:.9}
.stat .si{position:absolute;right:12px;top:10px;font-style:normal;font-size:34px;opacity:.28}
.c1{background:linear-gradient(135deg,#12356e,#0A234B)}
.c2{background:linear-gradient(135deg,#12a150,#0b6f35)}
.c3{background:linear-gradient(135deg,#e25555,#a52222)}
.c4{background:linear-gradient(135deg,#f4b24a,#c27a0c)}
.c5{background:linear-gradient(135deg,#0fa7d6,#0a6f93)}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools h2{margin:0;font-size:16px;color:var(--navy);margin-right:auto}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input.i{padding-left:36px;margin:0}
.search:before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.seg{display:inline-flex;background:var(--light);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--grey)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}

table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{background:var(--light);font-size:11.5px;color:var(--navy);font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
tbody tr{transition:.12s}tbody tr:hover{background:#f7faff}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.shop{display:flex;gap:11px;align-items:center;min-width:200px}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--navy3),var(--cyan))}
.shop b{display:block;color:var(--navy)}
.shop small{color:var(--grey)}
.code{font-family:Consolas,monospace;background:var(--light);color:var(--navy);padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px}
.acts{display:flex;gap:5px;flex-wrap:nowrap}
.em{padding:34px 10px;text-align:center;color:var(--grey)}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.ok{background:#e1f5e9;color:var(--green)}
.badge.no{background:#fde7e7;color:var(--red)}
.badge.warn{background:#fff1d9;color:#9a5b00}
.plan{background:var(--light);color:var(--navy);text-transform:capitalize}

/* ---------- Modal / form ---------- */
.modalbg{position:fixed;inset:0;background:rgba(7,26,58,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:620px;margin-top:28px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .18s}
.modal h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.modal .hint{color:var(--grey);margin:0 0 14px;font-size:13px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
label.f{display:block;font-size:12px;color:var(--grey);font-weight:600}
.f input,.f select,input.i,select.i{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;margin-top:4px;background:#fafcff;transition:.15s}
.f input:focus,.f select:focus,input.i:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(1,195,255,.14);outline:0;background:#fff}
.f input[readonly]{background:#eef1f6;color:var(--grey)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.full{grid-column:1/-1}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;font-weight:600;color:var(--navy)}
.chips button:hover{background:var(--light)}
.danger{background:#fff5f5;border:1px solid #f6caca;border-radius:12px;padding:12px 14px;color:#8a1c1c;margin:10px 0;font-size:13px}
.cred{background:var(--light);border:1px dashed #a9c4ee;border-radius:12px;padding:14px;margin:12px 0;line-height:1.9}
.cred b{color:var(--navy)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0f1b2e;color:#fff;padding:11px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13.5px;animation:pop .18s}
#toast div.bad{background:var(--red)}

@media(max-width:820px){
 .login{grid-template-columns:1fr}.hero{display:none}
 .wrap{padding:14px}header.bar{padding:10px 14px}
 .tools h2{width:100%}.search{max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const API=location.origin;
let TOKEN=null,SHOPS=[],FILTER='all',QUERY='';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,bad){const d=document.createElement('div');d.textContent=m;if(bad)d.className='bad';$('toast').appendChild(d);setTimeout(()=>d.remove(),bad?4500:2600)}
function modal(html){closeModal();const d=document.createElement('div');d.className='modalbg';d.id='mdl';d.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(d)}
function closeModal(){const m=$('mdl');if(m)m.remove()}
const LOGO=`<svg class="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="76" height="76" rx="16" fill="#fff" stroke="#01C3FF" stroke-width="3"/><text x="14" y="58" font-family="Arial Black,Arial" font-weight="900" font-size="52" fill="#0A234B">U</text><text x="40" y="58" font-family="Arial Black,Arial" font-weight="900" font-size="52" fill="#0A234B">A</text><path d="M58 14 L66 22 L78 6" fill="none" stroke="#E02020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="48" width="6" height="10" fill="#01C3FF"/><rect x="68" y="42" width="6" height="16" fill="#01C3FF"/></svg>`;

async function api(path,method,body){
 const r=await fetch(API+path,{method:method||'GET',headers:Object.assign({'X-Auth-Token':TOKEN||''},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&TOKEN){logout(true);throw new Error('Session khatam — dobara login karein')}
 if(!r.ok)throw new Error(j.error||('Error '+r.status));
 return j;
}

/* ---------- Login ---------- */
function renderLogin(){
 $('app').innerHTML=`<div class="login">
 <div class="hero">${LOGO}<h2>UltraAccounting<br>Super Admin</h2><p>Saari dukaano ko ek jagah se manage karein — naya shop banayein, plan badhayein, block ya delete karein.</p>
  <ul><li><i>🏪</i>Shop onboarding in 1 minute</li><li><i>🛡️</i>Instant block / unblock</li><li><i>📅</i>Plan &amp; validity control</li></ul></div>
 <div class="formside"><div class="box"><h1>Welcome back 👋</h1><p class="sub">Super Admin panel me login karein</p>
 <label>Username<input id="u" value="superadmin" autocomplete="username"></label>
 <label>Password<input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
 <div class="err" id="e"></div>
 <button class="go" id="lb" onclick="doLogin()">Login</button></div></div></div>`;
 setTimeout(()=>{const p=$('p');if(p)p.focus()},50);
}
async function doLogin(){
 const u=$('u').value.trim(),p=$('p').value;
 if(!u||!p){$('e').textContent='Username aur password bharein';return}
 const b=$('lb');b.disabled=true;b.textContent='Checking…';
 try{
  const r=await fetch(API+'/api/super/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const j=await r.json();
  if(!r.ok){$('e').textContent=j.error||'Login fail';b.disabled=false;b.textContent='Login';return}
  TOKEN=j.token;try{sessionStorage.setItem('sa_token',TOKEN)}catch(e){}
  renderDash();
 }catch(e){$('e').textContent='Network error';b.disabled=false;b.textContent='Login'}
}
function logout(expired){TOKEN=null;try{sessionStorage.clear()}catch(e){}renderLogin();if(expired)setTimeout(()=>{const e=$('e');if(e)e.textContent='Session khatam ho gaya, dobara login karein'},30)}

/* ---------- Helpers ---------- */
const now=()=>Math.floor(Date.now()/1000);
const dstr=t=>t?new Date(t*1000).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const ymd=t=>{const d=new Date(t*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function state(s){ // status of shop
 if(!s.active)return'blocked';
 if(s.active_until&&s.active_until<now())return'expired';
 if(s.active_until&&s.active_until-now()<7*86400)return'soon';
 return'active';
}
function ago(t){if(!t)return'—';const d=now()-t;if(d<90)return'abhi';if(d<3600)return Math.floor(d/60)+' min pehle';if(d<86400)return Math.floor(d/3600)+' ghante pehle';return Math.floor(d/86400)+' din pehle'}

/* ---------- Dashboard ---------- */
function renderDash(){
 $('app').innerHTML=`<header class="bar"><div class="t">${LOGO}<div><h1>UltraAccounting</h1><small>Super Admin Panel</small></div></div>
  <div class="r"><button class="btn g" onclick="newShop()">＋ Naya Shop</button><button class="btn ghost" onclick="chPw()">🔑 Password</button><button class="btn ghost" onclick="logout()">Logout</button></div></header>
  <div class="wrap"><div id="content"><div class="em">Loading…</div></div></div>`;
 load();
}
async function load(){
 try{SHOPS=await api('/api/super/shops');drawAll()}
 catch(e){const c=$('content');if(c)c.innerHTML='<div class="card em">⚠️ '+esc(e.message)+'<br><br><button class="btn" onclick="load()">Retry</button></div>'}
}
function drawAll(){
 const c={all:SHOPS.length,active:0,blocked:0,expired:0,soon:0};let bills=0;
 SHOPS.forEach(s=>{const st=state(s);if(st==='blocked')c.blocked++;else{c.active++;if(st==='expired')c.expired++;if(st==='soon')c.soon++}bills+=s.bills_count});
 $('content').innerHTML=`<div class="stats">
  <div class="stat c1"><i class="si">🏪</i><b>${c.all}</b><span>Total Shops</span></div>
  <div class="stat c2"><i class="si">✅</i><b>${c.active}</b><span>Active</span></div>
  <div class="stat c3"><i class="si">⛔</i><b>${c.blocked}</b><span>Blocked</span></div>
  <div class="stat c4"><i class="si">⏰</i><b>${c.soon+c.expired}</b><span>Expiring / Expired</span></div>
  <div class="stat c5"><i class="si">🧾</i><b>${bills}</b><span>Total Bills</span></div></div>
  <div class="card"><div class="tools"><h2>All Shops</h2>
   <div class="search"><input class="i" id="q" placeholder="Code, naam, owner, mobile…" value="${esc(QUERY)}" oninput="QUERY=this.value;drawRows()"></div>
   <div class="seg" id="seg"></div></div>
   <div class="tw" id="rows"></div></div>`;
 drawSeg();drawRows();
}
function drawSeg(){
 const f=[['all','All'],['active','Active'],['soon','Expiring'],['expired','Expired'],['blocked','Blocked']];
 $('seg').innerHTML=f.map(x=>`<button class="${FILTER===x[0]?'on':''}" onclick="FILTER='${x[0]}';drawSeg();drawRows()">${x[1]}</button>`).join('');
}
function drawRows(){
 const q=QUERY.trim().toLowerCase();
 const a=SHOPS.filter(s=>{
  if(FILTER!=='all'){const st=state(s);if(FILTER==='active'?st==='blocked':st!==FILTER)return false}
  return !q||[s.code,s.name,s.owner,s.mobile,s.admin_username].join(' ').toLowerCase().includes(q);
 });
 const el=$('rows');if(!el)return;
 if(!a.length){el.innerHTML='<div class="em">'+(SHOPS.length?'Koi shop match nahi hua.':'Abhi koi shop nahi hai. <b>＋ Naya Shop</b> se pehla shop banayein.')+'</div>';return}
 const B={active:['ok','Active'],blocked:['no','Blocked'],expired:['no','Expired'],soon:['warn','Expiring']};
 el.innerHTML=`<table><thead><tr><th>Shop</th><th>Code</th><th>Contact</th><th>Admin Login</th><th class="n">Bills</th><th>Plan</th><th>Valid Till</th><th>Last Sync</th><th>Status</th><th>Actions</th></tr></thead><tbody>
 ${a.map(s=>{const st=state(s),b=B[st];return `<tr>
  <td><div class="shop"><div class="av">${esc((s.name||'?').trim().charAt(0).toUpperCase())}</div><div><b>${esc(s.name)}</b><small>${esc(s.address||'')}</small></div></div></td>
  <td><span class="code">${esc(s.code)}</span></td>
  <td>${esc(s.owner||'—')}<br><small style="color:var(--grey)">${esc(s.mobile||'')}</small></td>
  <td>${esc(s.admin_username||'—')}</td>
  <td class="n">${s.bills_count}</td>
  <td><span class="badge plan">${esc(s.plan)}</span></td>
  <td>${dstr(s.active_until)}</td>
  <td>${ago(s.last_activity)}</td>
  <td><span class="badge ${b[0]}">${b[1]}</span></td>
  <td><div class="acts">
   <button class="btn s" onclick="editShop('${s.id}')">✏️ Edit</button>
   <button class="btn l s" onclick="resetPw('${s.id}')">🔑</button>
   <button class="btn ${s.active?'o':'g'} s" onclick="toggleShop('${s.id}')">${s.active?'Block':'Unblock'}</button>
   <button class="btn r s" onclick="delShop('${s.id}')">🗑️</button></div></td></tr>`}).join('')}
 </tbody></table>`;
}

/* ---------- New shop ---------- */
function newShop(){
 modal(`<h2>Naya Shop Banao</h2><p class="hint">Shop banate hi uska admin login ready ho jayega.</p><div class="g2">
  <label class="f">Shop Code * (unique)<input id="n_code" placeholder="SHARMA001" style="text-transform:uppercase"></label>
  <label class="f">Shop Name *<input id="n_name" placeholder="Sharma Kirana Store"></label>
  <label class="f">Owner<input id="n_owner"></label>
  <label class="f">Mobile<input id="n_mob" maxlength="10" inputmode="numeric"></label>
  <label class="f full">Address<input id="n_addr"></label>
  <label class="f">GST No.<input id="n_gst"></label>
  <label class="f">Plan<select id="n_plan"><option value="trial">Trial</option><option value="basic">Basic</option><option value="pro">Pro</option></select></label>
  <label class="f">Validity (months)<input id="n_months" type="number" value="1" min="1"></label>
  <label class="f">Admin Username<input id="n_user" value="admin"></label>
  <label class="f full">Admin Password * (min 6)<input id="n_pass" type="text" placeholder="e.g. Shop@1234"></label>
 </div><div class="err" id="me"></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" id="mbtn" onclick="createShop()">Create Shop</button></div>`);
}
async function createShop(){
 const body={code:$('n_code').value.trim().toUpperCase(),name:$('n_name').value.trim(),owner:$('n_owner').value.trim(),mobile:$('n_mob').value.trim(),address:$('n_addr').value.trim(),gst_no:$('n_gst').value.trim().toUpperCase(),plan:$('n_plan').value,months:Number($('n_months').value)||1,admin_username:$('n_user').value.trim().toLowerCase()||'admin',admin_password:$('n_pass').value};
 if(!body.code||!body.name||!body.admin_password){$('me').textContent='Code, name aur password zaroori hai';return}
 if(body.admin_password.length<6){$('me').textContent='Password kam se kam 6 character';return}
 const b=$('mbtn');b.disabled=true;
 try{
  await api('/api/super/shops','POST',body);
  showCreds(body);load();
 }catch(e){$('me').textContent=e.message;b.disabled=false}
}
function showCreds(b){
 const link=location.origin;
 const text=`*${b.name}* — UltraAccounting login\nLink: ${link}\nShop Code: ${b.code}\nUsername: ${b.admin_username}\nPassword: ${b.admin_password}\nHelp: 7602292599`;
 window._cred=text;
 modal(`<h2>✅ Shop ban gaya!</h2><p class="hint">Ye details dukaan wale ko bhej dein.</p>
 <div class="cred">🌐 Link: <b>${esc(link)}</b><br>🏪 Shop Code: <b>${esc(b.code)}</b><br>👤 Username: <b>${esc(b.admin_username)}</b><br>🔑 Password: <b>${esc(b.admin_password)}</b></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Close</button><button class="btn" onclick="copyCred()">📋 Copy</button>
 <button class="btn g" onclick="waCred('${esc(b.mobile)}')">WhatsApp</button></div>`);
}
function copyCred(){try{navigator.clipboard.writeText(window._cred).then(()=>toast('Copy ho gaya'))}catch(e){toast('Copy nahi hua',true)}}
function waCred(m){const d=String(m||'').replace(/\D/g,'');window.open('https://wa.me/'+(d.length===10?'91'+d:d)+'?text='+encodeURIComponent(window._cred),'_blank')}

/* ---------- Edit shop ---------- */
function editShop(id){
 const s=SHOPS.find(x=>x.id===id);if(!s)return;
 const vt=s.active_until?ymd(s.active_until):'';
 modal(`<h2>✏️ Shop Edit — ${esc(s.code)}</h2><p class="hint">Shop code login ka hissa hai, isliye badla nahi ja sakta.</p><div class="g2">
  <label class="f">Shop Code<input value="${esc(s.code)}" readonly></label>
  <label class="f">Shop Name *<input id="e_name" value="${esc(s.name)}"></label>
  <label class="f">Owner<input id="e_owner" value="${esc(s.owner||'')}"></label>
  <label class="f">Mobile<input id="e_mob" value="${esc(s.mobile||'')}" maxlength="10" inputmode="numeric"></label>
  <label class="f">Email<input id="e_email" value="${esc(s.email||'')}"></label>
  <label class="f">GST No.<input id="e_gst" value="${esc(s.gst_no||'')}"></label>
  <label class="f full">Address<input id="e_addr" value="${esc(s.address||'')}"></label>
  <label class="f">Plan<select id="e_plan">${['trial','basic','pro'].map(p=>`<option value="${p}"${s.plan===p?' selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></label>
  <label class="f">Valid Till<input id="e_vt" type="date" value="${vt}">
   <div class="chips"><button onclick="addMonths(1)">+1 mahina</button><button onclick="addMonths(3)">+3</button><button onclick="addMonths(6)">+6</button><button onclick="addMonths(12)">+1 saal</button></div></label>
 </div><div class="err" id="me"></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" id="mbtn" onclick="saveShop('${s.id}')">Save Changes</button></div>`);
}
function addMonths(m){ // extend from later of (current date, today)
 const el=$('e_vt');const base=el.value&&new Date(el.value)>new Date()?new Date(el.value):new Date();
 base.setMonth(base.getMonth()+m);
 el.value=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0')+'-'+String(base.getDate()).padStart(2,'0');
}
async function saveShop(id){
 const body={shop_id:id,name:$('e_name').value.trim(),owner:$('e_owner').value.trim(),mobile:$('e_mob').value.trim(),email:$('e_email').value.trim(),gst_no:$('e_gst').value.trim(),address:$('e_addr').value.trim(),plan:$('e_plan').value,valid_till:$('e_vt').value};
 if(!body.name){$('me').textContent='Shop name zaroori hai';return}
 const b=$('mbtn');b.disabled=true;
 try{await api('/api/super/update-shop','POST',body);closeModal();toast('Shop update ho gaya ✔');load()}
 catch(e){$('me').textContent=e.message;b.disabled=false}
}

/* ---------- Reset password / Block / Delete ---------- */
function resetPw(id){
 const s=SHOPS.find(x=>x.id===id);if(!s)return;
 modal(`<h2>🔑 Password Reset</h2><p class="hint">${esc(s.name)} (${esc(s.code)}) ke admin <b>${esc(s.admin_username||'admin')}</b> ka naya password.</p>
 <label class="f">Naya Password (min 6)<input id="r_pw" type="text"></label><div class="err" id="me"></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="doReset('${s.id}')">Reset</button></div>`);
 setTimeout(()=>{const e=$('r_pw');if(e)e.focus()},50);
}
async function doReset(id){
 const np=$('r_pw').value.trim();if(np.length<6){$('me').textContent='Password kam se kam 6 character';return}
 try{await api('/api/super/reset-shop-password','POST',{shop_id:id,new_password:np});closeModal();toast('Password reset ho gaya ✔')}
 catch(e){$('me').textContent=e.message}
}
async function toggleShop(id){
 const s=SHOPS.find(x=>x.id===id);if(!s)return;
 if(s.active&&!confirm(s.name+' ko block karein? Wo login/sync nahi kar payenge.'))return;
 try{const j=await api('/api/super/toggle-shop','POST',{shop_id:id});toast(j.active?'Shop unblock ho gaya':'Shop block ho gaya');load()}
 catch(e){toast(e.message,true)}
}
function delShop(id){
 const s=SHOPS.find(x=>x.id===id);if(!s)return;
 modal(`<h2 style="color:var(--red)">🗑️ Shop Delete</h2>
 <div class="danger"><b>${esc(s.name)}</b> (${esc(s.code)}) — ${s.bills_count} bills, ${s.users_count} users.<br>Shop, uske users aur <b>saara data (bills, customers, items)</b> hamesha ke liye delete ho jayega. Wapas nahi aayega.<br>Agar sirf rokna hai to <b>Block</b> use karein.</div>
 <label class="f">Confirm ke liye shop code <b>${esc(s.code)}</b> likhein<input id="d_code" placeholder="${esc(s.code)}" autocomplete="off" oninput="$('dbtn').disabled=this.value.trim().toUpperCase()!=='${esc(s.code)}'"></label>
 <div class="err" id="me"></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn r" id="dbtn" disabled onclick="doDelete('${s.id}')">Haan, Delete Karo</button></div>`);
 setTimeout(()=>{const e=$('d_code');if(e)e.focus()},50);
}
async function doDelete(id){
 const b=$('dbtn');b.disabled=true;
 try{await api('/api/super/delete-shop','POST',{shop_id:id,confirm_code:$('d_code').value.trim()});closeModal();toast('Shop delete ho gaya');load()}
 catch(e){$('me').textContent=e.message;b.disabled=false}
}

/* ---------- Change super admin password ---------- */
function chPw(){
 modal(`<h2>🔑 Super Admin Password</h2><p class="hint">Default password <b>ultra@2026</b> turant badal dein.</p>
 <div class="g2"><label class="f full">Purana Password<input id="p0" type="password"></label>
 <label class="f">Naya Password (min 8)<input id="p1" type="password"></label>
 <label class="f">Dobara likhein<input id="p2" type="password"></label></div><div class="err" id="me"></div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="doChPw()">Change</button></div>`);
}
async function doChPw(){
 const a=$('p0').value,b=$('p1').value,c=$('p2').value;
 if(b.length<8){$('me').textContent='Naya password kam se kam 8 character';return}
 if(b!==c){$('me').textContent='Dono password same nahi hain';return}
 try{await api('/api/super/change-password','POST',{current_password:a,new_password:b});closeModal();toast('Password badal gaya ✔')}
 catch(e){$('me').textContent=e.message}
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(function init(){
 try{const t=sessionStorage.getItem('sa_token');if(t){TOKEN=t;renderDash();return}}catch(e){}
 renderLogin();
})();
</script>
