<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A234B">
<link rel="icon" href="/icon.svg">
<title>UltraAccounting — Billing Software</title>
<style>
:root{--navy:#0A234B;--navy2:#071a3a;--navy3:#12356e;--cyan:#01C3FF;--light:#EEF4FD;--green:#0E8A3E;--red:#C62828;--amber:#E69A1F;--grey:#64748b;--bg:#f2f5fb;--white:#fff;--line:#e3e9f3;--ink:#0f1b2e;--sh:0 1px 2px rgba(10,35,75,.05),0 10px 30px -16px rgba(10,35,75,.2)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font:14px/1.5 Inter,"Segoe UI","Nirmala UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c9d4e6;border-radius:9px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}@keyframes up{from{opacity:0;transform:translateY(8px)}}
/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .hero{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(900px 500px at 10% 0%,rgba(1,195,255,.28),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(1,195,255,.18),transparent 60%),linear-gradient(160deg,var(--navy2),var(--navy3))}
.login .hero svg{width:68px;height:68px}
.login .hero h2{font-size:36px;line-height:1.12;margin:18px 0 10px;font-weight:800;letter-spacing:-.6px}
.login .hero p{opacity:.8;max-width:430px;margin:0 0 24px}
.login .hero ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.login .hero li{display:flex;gap:12px;align-items:center;opacity:.93}
.login .hero li i{font-style:normal;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.login .formside{display:grid;place-items:center;padding:24px;background:#fff}
.login .box{width:100%;max-width:380px;animation:up .3s}
.login h1{font-size:27px;margin:0 0 4px;color:var(--navy);font-weight:800;letter-spacing:-.4px}
.login p.sub{margin:0 0 20px;color:var(--grey)}
.login label{display:block;font-weight:600;font-size:13px;margin-top:14px;color:var(--navy)}
.login input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;margin-top:6px;background:#fafcff;transition:.15s}
.login input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(1,195,255,.15);background:#fff;outline:0}
.login button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--navy3),var(--navy));color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(10,35,75,.6);transition:.15s}
.login button:hover{transform:translateY(-1px)}.login button[disabled]{opacity:.6}
.login .err{color:var(--red);font-weight:600;min-height:20px;margin-top:12px;font-size:13px}
.login .foot{text-align:center;margin-top:22px;font-size:13px;color:var(--grey)}.login .foot b{color:var(--navy)}
/* Wizard */
.wizard{min-height:100vh;background:linear-gradient(180deg,#e6eefb,var(--bg) 40%);padding:20px;display:flex;justify-content:center;align-items:flex-start}
.wizard .card{background:#fff;border-radius:20px;padding:28px;max-width:720px;width:100%;box-shadow:0 30px 60px -30px rgba(10,35,75,.35);margin-top:20px;border:1px solid var(--line);animation:up .3s}
.wizard h2{margin:0 0 4px;color:var(--navy);font-size:24px;letter-spacing:-.4px}
.wizard p.s{margin:0 0 20px;color:var(--grey)}
.wizard .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.wizard label{display:block;font-weight:600;font-size:13px;color:var(--navy);margin-top:6px}
.wizard input,.wizard select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:4px;background:#fafcff}
.wizard input:focus,.wizard select:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(1,195,255,.14);outline:0}
.wizard .btns{display:flex;gap:10px;margin-top:22px}
.wizard button{padding:12px 24px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.wizard button.primary{background:linear-gradient(135deg,var(--navy3),var(--navy));color:#fff;box-shadow:0 10px 22px -10px rgba(10,35,75,.6)}
.wizard button.ghost{background:#eef2f8;color:var(--navy)}
.wizard .hint{background:var(--light);border-left:4px solid var(--cyan);padding:11px 14px;margin-top:14px;font-size:12.5px;color:var(--navy);border-radius:8px}
/* Shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:radial-gradient(400px 260px at 0% 0%,rgba(1,195,255,.2),transparent 70%),linear-gradient(180deg,var(--navy3),var(--navy2));color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.brand svg{width:42px;height:42px;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.2px}.brand small{font-size:11.5px;opacity:.7;display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#c3d1e6;padding:11px 14px;border-radius:12px;cursor:pointer;margin:2px 0;font-size:14px;transition:.15s;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:linear-gradient(135deg,#27d2ff,var(--cyan));color:var(--navy);font-weight:700;box-shadow:0 8px 20px -8px rgba(1,195,255,.7)}
.side .me{margin-top:auto;padding:14px 8px 2px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#c3d1e6}
.side .me b{color:#fff;display:block;font-size:13.5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 24px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:20px;margin:0;color:var(--navy);letter-spacing:-.3px}.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff}
.chip i{width:8px;height:8px;border-radius:50%;background:#999}
.chip.ok{background:#e4f5ea;border-color:#bfe3cc;color:var(--green)}.chip.ok i{background:var(--green);box-shadow:0 0 0 3px rgba(14,138,62,.18)}
.chip.warn{background:#fff3dc;border-color:#f1d8a4;color:#8a5200}.chip.warn i{background:var(--amber)}
.chip.bad{background:#fde8e8;border-color:#f4c3c3;color:var(--red)}.chip.bad i{background:var(--red)}
.view{padding:22px 24px;flex:1;animation:up .25s}
.foot{padding:12px 22px;font-size:12px;color:var(--grey);border-top:1px solid var(--line);background:#fff;text-align:center}.foot b{color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:var(--sh)}
.card h2{font-size:15.5px;margin:0 0 14px;color:var(--navy);letter-spacing:-.2px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;background:linear-gradient(135deg,var(--navy3),var(--navy));color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13.5px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12)}.btn:active{transform:none}
.btn.g{background:linear-gradient(135deg,#12a150,var(--green))}
.btn.o{background:linear-gradient(135deg,#f4b24a,var(--amber));color:#2a1a00}
.btn.l{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.l:hover{background:var(--light)}
.btn.r{background:linear-gradient(135deg,#e04848,var(--red))}
.btn.s{padding:6px 11px;font-size:12.5px;border-radius:8px}.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fafcff;margin-top:4px;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(1,195,255,.14);outline:0;background:#fff}
input[type=checkbox]{width:auto;margin:0}
label.f{display:block;font-size:12px;color:var(--grey);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;border-radius:16px;color:#fff;padding:18px 20px;box-shadow:var(--sh);transition:.2s}
.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:12.5px;opacity:.92;margin-top:4px;display:block}
.stat .si{position:absolute;right:12px;top:10px;font-style:normal;font-size:36px;opacity:.25}
.s1{background:linear-gradient(135deg,#12a150,#0a6b30)}.s2{background:linear-gradient(135deg,#12356e,#0A234B)}
.s3{background:linear-gradient(135deg,#7a5ce0,#4a35a8)}.s4{background:linear-gradient(135deg,#f4b24a,#c27a0c)}
.s5{background:linear-gradient(135deg,#e25555,#a52222)}.s6{background:linear-gradient(135deg,#0fa7d6,#0a6f93)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
th{background:var(--light);font-size:11.5px;color:var(--navy);font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
tr:hover td{background:#f7faff}
td.n,th.n{text-align:right;white-space:nowrap}.tw{overflow-x:auto}
.bdg{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bdg.ok{background:#e1f5e9;color:var(--green)}.bdg.warn{background:#fff1d9;color:#9a5b00}.bdg.bad{background:#fde7e7;color:var(--red)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0f1b2e;color:#fff;padding:11px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13.5px;animation:pop .18s}
#toast div.bad{background:var(--red)}
.modalbg{position:fixed;inset:0;background:rgba(7,26,58,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:560px;margin-top:36px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .18s}
.modal.wide{max-width:900px}.modal h2{margin:0 0 12px;font-size:19px;color:var(--navy)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.muted{color:var(--grey);font-size:12.5px}.em{padding:26px;color:var(--grey);text-align:center;font-size:13.5px}
.banner{padding:11px 15px;border-radius:12px;margin-bottom:14px;background:#fff3dc;border:1px solid #f1d8a4;color:#6d4300;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.banner.bad{background:#fde8e8;border-color:#f4c3c3;color:var(--red)}
.banner.edit{background:linear-gradient(135deg,#e8f4ff,#eef0ff);border-color:#b9d4f5;color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:150px;padding:12px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;cursor:pointer;font-size:13.5px}
.tabs button.on{border-color:var(--navy);background:var(--light);color:var(--navy)}
.sugw{position:relative}.sug{position:absolute;z-index:20;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;box-shadow:0 14px 30px -10px rgba(10,35,75,.25);display:none}
.sug div{padding:10px 14px;cursor:pointer;border-bottom:1px solid #eef2f8;display:flex;justify-content:space-between;gap:10px}.sug div:hover{background:var(--light)}
.tot{display:grid;grid-template-columns:1fr auto;gap:7px 18px;max-width:360px;margin-left:auto;font-size:14px;background:var(--light);padding:14px 16px;border-radius:14px}
.tot b.big{font-size:22px;color:var(--navy)}
.acts{display:flex;gap:5px;flex-wrap:nowrap}
@media(max-width:900px){
.login{grid-template-columns:1fr}.login .hero{display:none}
.shell{grid-template-columns:1fr}
.side{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:6px;overflow-x:auto;overflow-y:hidden}
.brand{border:0;margin:0;padding:0 8px 0 2px}.brand small{display:none}.brand b{font-size:14px}.brand svg{width:34px;height:34px}
.nav{display:flex;gap:2px;flex:1}.nav button{width:auto;padding:8px 12px;font-size:13px;margin:0;border-radius:10px}.side .me{display:none}
.view{padding:14px}.top{padding:10px 14px;position:static}.top h1{font-size:17px}.foot{padding:8px 14px;font-size:11px}.stat b{font-size:22px}.stat .si{font-size:28px}
.tot{max-width:none}}
/* Print */
#printArea{display:none}
.rc{color:#000;font-family:Arial,"Nirmala UI",sans-serif;width:100%;font-size:12px;padding:8px}
.rh{display:flex;gap:12px;align-items:center;border-bottom:2px solid #0A234B;padding-bottom:8px}
.rh svg{width:60px;height:60px}
.rh .name{font-size:22px;font-weight:800;color:#0A234B;letter-spacing:.5px}
.rh .addr{font-size:11.5px;color:#333}
.rh .gst{font-size:11.5px;color:#0A234B;font-weight:700}
.rtitle{text-align:center;font-weight:800;font-size:14px;letter-spacing:1px;margin:8px 0;padding:6px;background:#0A234B;color:#fff;border-radius:4px}
.rmeta{display:flex;justify-content:space-between;gap:18px;margin:8px 0;font-size:12px}
.rmeta td{padding:2px 6px 2px 0;border:0}
.rc table.items{width:100%;border-collapse:collapse;margin-top:6px}
.rc table.items th{background:#0A234B;color:#fff;font-size:11.5px;padding:6px 8px;border:1px solid #0A234B;text-align:left}
.rc table.items td{padding:5px 8px;font-size:12px;border-bottom:1px solid #ddd}
.rc table.items tr:nth-child(even) td{background:#f8fafc}
.rbot{display:flex;justify-content:space-between;gap:20px;margin-top:8px;font-size:12.5px}
.rtot td{border:0;padding:3px 0 3px 24px;text-align:right;font-size:12.5px}
.rtot tr.net td{border-top:2px solid #0A234B;font-weight:800;font-size:14px;padding-top:6px}
.rnote{text-align:center;font-weight:600;font-size:11px;margin-top:10px;border-top:1px dashed #333;padding-top:6px;color:#555}
@media print{body.printing #app,body.printing #toast,body.printing .modalbg{display:none!important}
body.printing #printArea{display:block}body.printing{background:#fff}}
</style>
<style id="pg"></style>

<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="toast"></div>

<script>
'use strict';
const HELP_PHONE='7602292599', HELP_EMAIL='support@ultraaccounting.com';
const API_BASE=(location.protocol==='file:')?'':location.origin;
const STORES=['settings','items','customers','bills','payments','users','audit','meta','parties','entries','expenses','suppliers','purchases'];
const SYNCED=['settings','items','customers','bills','payments','users','audit','parties','entries','expenses','suppliers','purchases'];
let idb=null,D={settings:[],items:[],customers:[],bills:[],payments:[],users:[],audit:[],meta:[],parties:[],entries:[],expenses:[],suppliers:[],purchases:[]};
let S={},M={},ME=null,TOKEN=null,SHOP=null,page='dashboard',F=null,syncing=false,syncMsg='',syncTimer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l)=>String(n).padStart(l,'0');
const ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);
const fd=s=>{if(!s)return'';const p=String(s).split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const inr=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const hp=p=>{let h=5381;const s='ua|'+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};

function toast(m,bad){const d=document.createElement('div');d.textContent=m;if(bad)d.className='bad';$('toast').appendChild(d);setTimeout(()=>d.remove(),bad?5000:2800)}
function modal(html,wide){closeModal();const d=document.createElement('div');d.className='modalbg';d.id='mdl';d.innerHTML=`<div class="modal${wide?' wide':''}">${html}</div>`;document.body.appendChild(d)}
function closeModal(){const m=$('mdl');if(m)m.remove()}

function openDB(){return new Promise(res=>{try{const r=indexedDB.open('ultra_accounting',4);r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function idbAll(s){return new Promise(res=>{if(!idb)return res([]);try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])}catch(e){res([])}})}
function idbPut(s,o){if(!idb)return;try{idb.transaction(s,'readwrite').objectStore(s).put(o)}catch(e){}}
function idbClear(s){return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=res;t.onerror=res}catch(e){res()}})}
function upsert(store,o){const a=D[store];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o)}
function put(store,o){o._u=Date.now();upsert(store,o);idbPut(store,o);if(SYNCED.includes(store)){M.dirty[store+'|'+o.id]=o._u;saveMeta();schedSync()}return o}
function del(store,id){const a=D[store];const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);if(idb){try{idb.transaction(store,'readwrite').objectStore(store).delete(id)}catch(e){}}if(SYNCED.includes(store)){M.dirty[store+'|'+id]=Date.now();saveMeta();schedSync()}}
function saveMeta(){idbPut('meta',M)}
function saveSettings(){if(S){S.id='main';idbPut('settings',S)}}
function log(action,ref,detail){put('audit',{id:uid(),ts:Date.now(),user:ME?ME.name:'-',action,ref:ref||'',detail:detail||''})}
function nextSeq(k){M.counters[k]=(M.counters[k]||0)+1;saveMeta();return M.counters[k]}

function pending(){return Object.keys(M.dirty||{}).length}
function schedSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),2500)}
async function syncNow(manual){
 if(!TOKEN||!API_BASE){if(manual)toast('Login ke baad hi sync hoga',true);return}
 if(!navigator.onLine){renderStatus();if(manual)toast('Internet nahi hai',true);return}
 if(syncing)return;syncing=true;syncMsg='Syncing…';renderStatus();
 try{
  const keys=Object.keys(M.dirty);
  for(let i=0;i<keys.length;i+=100){
   const chunk=keys.slice(i,i+100),rows=[],sent={};
   chunk.forEach(k=>{const[st,id]=k.split('|');const o=(D[st]||[]).find(x=>x.id===id);if(o){rows.push({store:st,id,data:o,updated_at:o._u||1});sent[k]=o._u}else delete M.dirty[k]});
   if(rows.length){const r=await fetch(API_BASE+'/api/records',{method:'POST',headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN},body:JSON.stringify(rows)});if(r.status===401){logout();toast('Session khatam ya shop block hai — dobara login karein',true);return}if(!r.ok)throw new Error('Upload fail ('+r.status+')')}
   Object.keys(sent).forEach(k=>{const[st,id]=k.split('|');const o=D[st].find(x=>x.id===id);if(!o||o._u===sent[k])delete M.dirty[k]});
  }
  let pulled=0;
  for(let loop=0;loop<200;loop++){
   const r=await fetch(API_BASE+'/api/records?since='+(M.lastPull||0)+'&limit=500',{headers:{'X-Auth-Token':TOKEN}});
   if(r.status===401){logout();toast('Session khatam ya shop block hai — dobara login karein',true);return}if(!r.ok)throw new Error('Download fail ('+r.status+')');
   const rows=await r.json();if(!rows.length)break;
   rows.forEach(row=>{const st=row.store;if(!D[st])return;const loc=D[st].find(x=>x.id===row.id);const o=row.data;const ru=o._u||row.updated_at;o._u=ru;if(!loc||(loc._u||0)<ru){upsert(st,o);idbPut(st,o);pulled++}if(row.updated_at>(M.lastPull||0))M.lastPull=row.updated_at});
   if(rows.length<500)break;
  }
  M.lastSync=Date.now();syncMsg='';saveMeta();
  if(manual)toast(pulled?('Synced. '+pulled+' records received.'):'Synced.');
  if(pulled&&page==='dashboard')render();
 }catch(e){syncMsg='Sync error: '+(e.message||e);if(manual)toast(syncMsg,true)}
 finally{syncing=false;saveMeta();renderStatus()}
}
function renderStatus(){const el=$('status');if(!el)return;let c='ok',t;const on=navigator.onLine;
 if(!on){c='bad';t='Offline — data local me safe hai'+(pending()?' ('+pending()+' waiting)':'')}
 else if(syncMsg&&syncMsg!=='Syncing…'){c='bad';t=syncMsg.slice(0,70)}
 else if(syncing){c='warn';t='Syncing…'}
 else if(pending()){c='warn';t='Online · '+pending()+' waiting to sync'}
 else{t='Online · synced'+(M.lastSync?' '+new Date(M.lastSync).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'')}
 el.className='chip '+c;el.innerHTML='<i></i>'+esc(t)}

   for(const st of STORES){await idbClear(st);D[st]=[]}

  }
  M.shop_id=SHOP.id;saveMeta();
  if(!S.setupDone){
   btn.textContent='Data la rahe hain…';await syncNow();S=D.settings[0]||{};
   if(!S.setupDone&&ME.role!=='admin'){TOKEN=null;ME=null;SHOP=null;try{sessionStorage.clear()}catch(e){}$('le').textContent='Shop ka setup abhi pura nahi hua. Pehle owner ko login karke setup karne dein (internet chahiye).';btn.disabled=false;btn.textContent='Login';return}

 const r=D.customers.filter(c=>(q.length>=2&&c.name.toLowerCase().includes(q))||(p.length>=4&&(c.mob||'').includes(p))).slice(0,8);

}
function useCust(id){const c=D.customers.find(x=>x.id===id);if(!c)return;F.customer_id=c.id;F.customer_name=c.name;F.customer_mob=c.mob||'';F.customer_addr=c.addr||'';drawBilling()}

function drawItems(){
 const el=$('f_items');if(!el)return;
 if(!F.items.length){el.innerHTML='<div class="em">Koi item nahi. Upar search karke add karein.</div>';return}
 el.innerHTML=`<div class="tw"><table><tr><th>#</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th><th></th></tr>
 ${F.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.name)}</td>
 <td class="n"><input type="number" step="0.01" min="0" value="${it.qty}" style="width:80px;text-align:right" oninput="itemSet(${i},'qty',this.value)"></td>
 <td class="n"><input type="number" step="0.01" min="0" value="${it.rate}" style="width:90px;text-align:right" oninput="itemSet(${i},'rate',this.value)"></td>
 <td class="n" id="amt_${i}">₹ ${inr(num(it.qty)*num(it.rate))}</td>

}
function itemSet(i,k,v){F.items[i][k]=k==='qty'||k==='rate'?num(v):v;const c=$('amt_'+i);if(c)c.textContent='₹ '+inr(num(F.items[i].qty)*num(F.items[i].rate));calc()}
function rmItem(i){F.items.splice(i,1);drawItems();calc()}

function drawSug(){
 const box=$('isug');if(!box)return;

 if(!q){box.style.display='none';return}

function itemKey(e){
 if(e.key==='Enter'){
  e.preventDefault();
  const q=$('f_item').value.trim();
  if(!q)return;
  const found=D.items.find(it=>it.name&&it.name.toLowerCase()===q.toLowerCase());

  else { addManual(q); }

function addItem(id){const it=D.items.find(x=>x.id===id);if(!it)return;
 if(F.items.some(x=>x.item_id===id)){toast('Ye item already added hai',true);return}
 F.items.push({item_id:id,name:it.name,qty:1,rate:num(it.rate||0),cost:num(it.cost||0)});
 $('f_item').value='';$('isug').style.display='none';drawItems();calc();$('f_item').focus();
}
function addManual(name){
 F.items.push({item_id:null,name,qty:1,rate:0});
 drawItems(); // Ye line missing thi
 calc();      // Ye line missing thi
 toast('Naya item add kiya. Rate daalein.',false);
}

function calcTot(f){
 const sub=f.items.reduce((s,it)=>s+num(it.qty)*num(it.rate),0);
 const disc=Math.min(Math.max(num(f.discount),0),sub);
 let net=sub-disc;
 let cgst=0,sgst=0;
 if(S.gst_no&&f.gst_enabled){cgst=Math.round(net*0.09*100)/100;sgst=Math.round(net*0.09*100)/100;net=net+cgst+sgst}
 return{sub:r2(sub),disc:r2(disc),cgst,sgst,net:r2(net)};
}
function calc(){
 const T=calcTot(F);
 const paid=F.paidT?num(F.paid):T.net;
 const set=(i,v)=>{const e=$(i);if(e)e.textContent=v};
 set('t_sub','₹ '+inr(T.sub));set('t_disc','₹ '+inr(T.disc));
 if($('t_cgst'))set('t_cgst','₹ '+inr(T.cgst));
 if($('t_sgst'))set('t_sgst','₹ '+inr(T.sgst));
 set('t_net','₹ '+inr(T.net));set('t_paid','₹ '+inr(paid));
 set('t_due','₹ '+inr(Math.max(0,T.net-paid)));
 const p=$('f_paid');if(p&&!F.paidT)p.value=T.net.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
}

const r2=n=>Math.round(num(n)*100)/100;
function adjStock(list,sign){(list||[]).forEach(l=>{if(!l.item_id)return;const it=D.items.find(x=>x.id===l.item_id);if(!it||it.qty===undefined||it.qty===null)return;put('items',Object.assign({},it,{qty:r2(num(it.qty)-sign*num(l.qty))}))})}
function canEdit(){return can('bill_edit')}
function editBill(id){
 const b=D.bills.find(x=>x.id===id);if(!b||b._del){toast('Bill nahi mila',true);return}
 if(!canEdit()){toast('Aapko bill edit karne ki permission nahi hai',true);return}
 closeModal();
 F={id:null,editId:b.id,editNo:b.no,customer_id:b.customer_id||null,customer_name:b.customer_name||'',customer_mob:b.customer_mob||'',customer_addr:b.customer_addr||'',
  items:(b.items||[]).map(i=>({item_id:i.item_id||null,name:i.name,qty:num(i.qty),rate:num(i.rate),cost:num(i.cost||0)})),
  discount:b.discount||0,paid:num(b.paid),paidT:true,mode:b.paid_mode||'Cash',notes:b.notes||'',date:b.date,gst_enabled:!!b.gst_enabled};
 page='billing';render();window.scrollTo(0,0);
}
function cancelEdit(){F=null;nav('bills')}
function saveBill(action){
 if(!F.customer_name.trim()){toast('Customer ka naam likhein',true);return}
 if(!F.items.length){toast('Kam se kam ek item add karein',true);return}
 if(F.items.some(it=>!(num(it.qty)>0))){toast('Har item ki quantity 0 se zyada honi chahiye',true);return}
 if(!F.date){toast('Bill date chunein',true);return}
 const old=F.editId?D.bills.find(x=>x.id===F.editId):null;
 if(F.editId&&(!old||old._del)){toast('Ye bill ab maujood nahi hai',true);return}
 const T=calcTot(F),paid=r2(F.paidT?num(F.paid):T.net);
 if(paid<0||paid>T.net+0.01){toast(F.editId?'Paid amount naye total se zyada hai — Paid kam karein':'Paid amount galat hai',true);return}
 let cid=F.customer_id;
 if(!cid||!D.customers.some(c=>c.id===cid)){
  const exist=D.customers.find(c=>F.customer_mob&&c.mob===F.customer_mob&&c.name.toLowerCase()===F.customer_name.toLowerCase());
  if(exist)cid=exist.id;
  else{const c={id:uid(),name:F.customer_name.trim(),mob:F.customer_mob.trim(),addr:F.customer_addr.trim(),created:ymd()};put('customers',c);cid=c.id}
 }
 const common={date:F.date,customer_id:cid,customer_name:F.customer_name.trim(),customer_mob:F.customer_mob.trim(),customer_addr:F.customer_addr.trim(),
  items:F.items.map(it=>({item_id:it.item_id,name:it.name,qty:num(it.qty),rate:num(it.rate),cost:num(it.cost||0)||null,amount:r2(num(it.qty)*num(it.rate))})),
  sub:T.sub,discount:T.disc,cgst:T.cgst,sgst:T.sgst,total:T.net,paid,paid_mode:F.mode,due:r2(T.net-paid),notes:F.notes,
  gst_enabled:!!(S.gst_no&&F.gst_enabled),gst_no:S.gst_no||''};
 let b;
 if(old){
  b=Object.assign({},old,common,{edited_by:ME.name,edited_at:Date.now(),edit_count:(old.edit_count||0)+1});
  put('bills',b);
  if(old.stock_done){adjStock(old.items,-1);adjStock(b.items,1)}
  const diff=r2(paid-num(old.paid));
  if(Math.abs(diff)>=0.01)put('payments',{id:uid(),bill_id:b.id,bill_no:b.no,date:ymd(),ts:Date.now(),amount:diff,mode:diff>0?F.mode:'Adjustment',note:'Bill edit',customer:cid});
  log('Edit bill',b.no,`₹${inr(old.total)} → ₹${inr(T.net)}`);
  toast('Bill update ho gaya: '+b.no);
 }else{
  const no=`${S.bill_prefix}-${ymd().slice(0,4)}-${pad(nextSeq('bill'),4)}`;
  b=Object.assign({id:uid(),no,ts:Date.now(),created_by:ME.name,stock_done:true},common);
  put('bills',b);adjStock(b.items,1);
  if(paid>0)put('payments',{id:uid(),bill_id:b.id,bill_no:b.no,date:ymd(),ts:Date.now(),amount:paid,mode:F.mode,customer:cid});
  log('Create bill',b.no,`₹${inr(T.net)}`);
  toast('Bill save ho gaya: '+b.no);
 }
 if(action==='wa')waBill(b.id);
 else if(action===true)printBill(b.id,'receipt');
 if(old){F=null;page='bills';render()}else{F=newBill();drawBilling()}
}

function purchaseForm(supId){
 const sups=D.suppliers.filter(s=>!s._del);
 if(!sups.length){toast('Pehle koi wholesaler add karein',true);supForm();return}
 const items=D.items;
 modal(`<h2>🚚 Nayi Kharidari (Import Stock)</h2>
  <div class="g2">
   <label class="f" style="grid-column:1/-1">Wholesaler *<select id="pu_sup">${sups.map(s=>`<option value="${s.id}"${s.id===supId?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
   <label class="f" style="grid-column:1/-1">Item * (Stock me add hoga)<select id="pu_item">${items.map(i=>`<option value="${i.id}">${esc(i.name)} (Stock: ${i.qty||0})</option>`).join('')}<option value="new">-- Naya Item Banao --</option></select></label>
   
   <div id="new_item_fields" style="display:none;grid-column:1/-1;background:var(--light);padding:10px;border-radius:8px;">
     <label class="f">Naya Item Name<input id="pu_new_name"></label>
   </div>

   <label class="f">Quantity *<input id="pu_qty" type="number" step="0.01" value="1"></label>
   <label class="f">Purchase Rate (₹) *<input id="pu_rate" type="number" step="0.01"></label>
   <label class="f">Total Amount<input id="pu_total" readonly style="background:#eee;font-weight:bold"></label>
   <label class="f">Paid Amount (₹)<input id="pu_paid" type="number" step="0.01" value="0"></label>
   <label class="f">Due (Dena)<input id="pu_due" readonly style="background:#eee;font-weight:bold;color:var(--red)"></label>
   <label class="f">Date<input id="pu_date" type="date" value="${ymd()}"></label>
  </div>
  <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="savePurchase()">Import to Stock</button></div>`);

 const calc=()=>{
   const tot=r2(num($('pu_qty').value)*num($('pu_rate').value));
   const due=r2(tot-num($('pu_paid').value));
   $('pu_total').value=tot; $('pu_due').value=due;
 };
 $('pu_qty').oninput=calc; $('pu_rate').oninput=calc; $('pu_paid').oninput=calc;
 $('pu_item').onchange=(e)=>{
   if(e.target.value==='new'){$('new_item_fields').style.display='block';$('pu_rate').value='';}
   else{$('new_item_fields').style.display='none';const it=items.find(x=>x.id===e.target.value);if(it&&it.cost)$('pu_rate').value=it.cost;}
   calc();
 };
}

function savePurchase(){
 const supId=$('pu_sup').value, sup= D.suppliers.find(x=>x.id===supId);
 let itemId=$('pu_item').value, itemName='', unit='pcs';
 
 if(itemId==='new'){
   itemName=$('pu_new_name').value.trim();
   if(!itemName){toast('Item ka naam likhein',true);return}
   itemId=uid();
   put('items',{id:itemId,name:itemName,qty:0,rate:0,cost:0,created:ymd()});
 } else {
   const it=D.items.find(x=>x.id===itemId);
   itemName=it.name; unit=it.unit||'pcs';
 }

 const qty=num($('pu_qty').value), rate=num($('pu_rate').value), paid=num($('pu_paid').value);
 const total=r2(qty*rate), due=r2(total-paid);
 
 if(qty<=0||rate<=0){toast('Qty aur Rate sahi daalein',true);return}
 if(paid>total){toast('Paid amount total se zyada nahi ho sakta',true);return}

 put('purchases',{
   id:uid(), ts:Date.now(), date:$('pu_date').value,
   supplier_id:supId, sup_name:sup.name, item_id:itemId, item_name:itemName,
   qty, rate, total, paid, due, unit
 });

 const it=D.items.find(x=>x.id===itemId);
 if(it){
   it.qty = r2(num(it.qty) + qty);
   const oldQty = num(it.qty) - qty;
   const oldCost = num(it.cost) || 0;
   const newCost = (oldQty * oldCost + total) / (oldQty + qty);
   it.cost = r2(newCost);
   put('items', it);
 }

 log('Import Stock', itemName, `₹${total} from ${sup.name}`);
 toast('Stock import ho gaya ✔');
 closeModal(); views.purchases();
}

 const b=supBal(supId); if(b<=0)return;
 const v=prompt('Wholesaler ko kitna payment diya? (Total Dena: ₹'+inr(b)+')','');
 if(v===null)return; const amt=num(v); if(amt<=0||amt>b){toast('Galat amount',true);return}
 
 put('purchases',{
   id:uid(), ts:Date.now(), date:ymd(), supplier_id:supId,
   sup_name:D.suppliers.find(x=>x.id===supId).name,
   item_name:'💵 Payment Adjustment', qty:0, rate:0, total:0, paid:amt, due:-amt
 });
 toast('Payment record ho gaya ✔'); views.purchases();
}

function billBadge(b){const d=num(b.due);if(d<=0.009)return'<span class="bdg ok">Paid</span>';return num(b.paid)>0?'<span class="bdg warn">Partial</span>':'<span class="bdg bad">Unpaid</span>'}
function drawBills(){

 const a=D.bills.filter(b=>!b._del&&b.date>=BF.from&&b.date<=BF.to&&(!q||(b.no+' '+b.customer_name+' '+(b.customer_mob||'')).toLowerCase().includes(q))).sort((x,y)=>y.ts-x.ts);
 const el=$('btable');if(!el)return;
 if(!a.length){el.innerHTML='<div class="em">Koi bill nahi mila.</div>';return}
 const sum=a.reduce((s,b)=>({t:s.t+num(b.total),p:s.p+num(b.paid),d:s.d+num(b.due)}),{t:0,p:0,d:0});
 el.innerHTML=`<div class="muted" style="margin-bottom:8px"><b>${a.length}</b> bills · Total <b>₹${inr(sum.t)}</b> · Paid <b>₹${inr(sum.p)}</b> · Due <b style="color:var(--red)">₹${inr(sum.d)}</b></div>
 <div class="tw"><table><tr><th>Bill No.</th><th>Date</th><th>Customer</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Due</th><th>Status</th><th>Actions</th></tr>
 ${a.slice(0,400).map(b=>`<tr><td><b>${esc(b.no)}</b>${b.edit_count?'<br><span class="muted">edited</span>':''}</td><td>${fd(b.date)}</td>
 <td>${esc(b.customer_name)}<br><span class="muted">${esc(b.customer_mob||'')}</span></td>
 <td class="n">₹ ${inr(b.total)}</td><td class="n">₹ ${inr(b.paid)}</td>
 <td class="n" style="color:${num(b.due)>0?'var(--red)':'inherit'}">₹ ${inr(b.due)}</td><td>${billBadge(b)}</td>
 <td><div class="acts"><button class="btn l s" onclick="viewBill('${b.id}')">View</button>
 ${canEdit()?`<button class="btn s" onclick="editBill('${b.id}')">✏️ Edit</button>`:''}
 ${num(b.due)>0&&can('receive')?`<button class="btn o s" onclick="payDue('${b.id}')">Receive</button>`:''}
 <button class="btn l s" onclick="waBill('${b.id}')">WA</button>
 ${can('bill_delete')?`<button class="btn r s" onclick="delBill('${b.id}')">Del</button>`:''}</div></td></tr>`).join('')}
 </table></div>`;
}
function viewBill(id){const b=D.bills.find(x=>x.id===id);if(!b)return;
 modal(`<h2>Bill ${esc(b.no)}</h2>
 <div style="border:1px solid var(--line);padding:12px;border-radius:6px;overflow:auto;max-height:70vh">${billHTML(b)}</div>

}
function payDue(id){if(!can('receive')){toast('Permission nahi hai',true);return}const b=D.bills.find(x=>x.id===id);if(!b)return;
 const v=prompt('Bill '+b.no+' — Due ₹'+inr(b.due)+'\nAmount received:',b.due);
 if(v===null)return;const a=num(v);if(a<=0||a>b.due){toast('Galat amount',true);return}
 const n=Object.assign({},b);n.paid=num(b.paid)+a;n.due=num(b.due)-a;
 put('bills',n);
 put('payments',{id:uid(),bill_id:b.id,bill_no:b.no,date:ymd(),ts:Date.now(),amount:a,mode:'Cash',customer:b.customer_id});
 log('Due received',b.no,'₹'+inr(a));
 toast('₹ '+inr(a)+' received');
 if(page==='bills')drawBills();else if(page==='due')drawDue();
}
function delBill(id){if(!can('bill_delete')){toast('Permission nahi hai',true);return}const b=D.bills.find(x=>x.id===id);if(!b)return;
 const why=prompt('Delete bill '+b.no+'?\nReason (required):');if(!why||!why.trim())return;
 const n=Object.assign({},b,{_del:true,delBy:ME.name,delWhy:why.trim()});put('bills',n);if(b.stock_done)adjStock(b.items,-1);log('Delete bill',b.no,why);toast('Deleted');drawBills()}

let RF={from:'',to:''};
views.reports=function(){
 if(!RF.from){const d=new Date();RF.from=ymd(new Date(d.getFullYear(),d.getMonth(),1));RF.to=ymd()}
 $('view').innerHTML=`<div class="card"><div class="row">
 <label class="f">From<input type="date" value="${RF.from}" onchange="RF.from=this.value;drawRep()"></label>
 <label class="f">To<input type="date" value="${RF.to}" onchange="RF.to=this.value;drawRep()"></label>
 <button class="btn l s" onclick="RF.from=ymd();RF.to=ymd();drawRep()">Today</button>
 <button class="btn l s" onclick="const n=new Date();RF.from=ymd(new Date(n.getFullYear(),n.getMonth(),1));RF.to=ymd();drawRep()">This Month</button>
 <button class="btn l s" onclick="const n=new Date();RF.from=ymd(new Date(n.getFullYear(),n.getMonth()-1,1));RF.to=ymd(new Date(n.getFullYear(),n.getMonth(),0));drawRep()">Last Month</button>
 <button class="btn g" onclick="exportCSV()">Export CSV</button>
 </div></div><div id="rep"></div>`;
 drawRep();
};
function drawRep(){
 const a=D.bills.filter(b=>!b._del&&b.date>=RF.from&&b.date<=RF.to).sort((x,y)=>x.date.localeCompare(y.date));
 const total=a.reduce((s,b)=>s+num(b.total),0),paid=a.reduce((s,b)=>s+num(b.paid),0),due=a.reduce((s,b)=>s+num(b.due),0);
 const disc=a.reduce((s,b)=>s+num(b.discount),0);
 const gst=a.reduce((s,b)=>s+num(b.cgst)+num(b.sgst),0);
 const kharcha=D.expenses.filter(e=>!e._del&&e.date>=RF.from&&e.date<=RF.to).reduce((x,e)=>x+num(e.amount),0);
 let profit=0;a.forEach(b=>{let ip=0,ca=0;(b.items||[]).forEach(i=>{if(num(i.cost)>0){ip+=(num(i.rate)-num(i.cost))*num(i.qty);ca+=num(i.amount)}});profit+=ip-(num(b.sub)>0?num(b.discount)*ca/num(b.sub):0)});
 const items={};a.forEach(b=>(b.items||[]).forEach(it=>{items[it.name]=(items[it.name]||0)+num(it.qty)}));
 const top=Object.entries(items).sort((x,y)=>y[1]-x[1]).slice(0,10);
 const days={};a.forEach(b=>{days[b.date]=days[b.date]||{count:0,total:0,paid:0,due:0};days[b.date].count++;days[b.date].total+=num(b.total);days[b.date].paid+=num(b.paid);days[b.date].due+=num(b.due)});
 $('rep').innerHTML=`
 <div class="stats">
  <div class="stat s1"><i class="si">💰</i><b>₹ ${inr(total)}</b><span>Total Sale</span></div>
  <div class="stat s2"><i class="si">📥</i><b>₹ ${inr(paid)}</b><span>Collection</span></div>
  <div class="stat s3"><i class="si">⏳</i><b>₹ ${inr(due)}</b><span>Due</span></div>
  <div class="stat s4"><i class="si">📄</i><b>${a.length}</b><span>Bills</span></div>
  <div class="stat s5"><i class="si">🏷️</i><b>₹ ${inr(disc)}</b><span>Discount</span></div>
  <div class="stat s6"><i class="si">🧮</i><b>₹ ${inr(gst)}</b><span>GST</span></div>
  <div class="stat s1"><i class="si">📈</i><b>₹ ${inr(profit)}</b><span>Munafa (items cost ke saath)</span></div>
  <div class="stat s5"><i class="si">💸</i><b>₹ ${inr(kharcha)}</b><span>Kharcha</span></div>
  <div class="stat s2"><i class="si">🏦</i><b>₹ ${inr(profit-kharcha)}</b><span>Munafa − Kharcha</span></div>
 </div>
 <div class="card"><h2>Day-wise</h2>${Object.keys(days).length?`<div class="tw"><table><tr><th>Date</th><th class="n">Bills</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Due</th></tr>
 ${Object.keys(days).sort().map(d=>`<tr><td>${fd(d)}</td><td class="n">${days[d].count}</td><td class="n">₹${inr(days[d].total)}</td><td class="n">₹${inr(days[d].paid)}</td><td class="n" style="color:${days[d].due>0?'var(--red)':'inherit'}">₹${inr(days[d].due)}</td></tr>`).join('')}
 </table></div>`:'<div class="em">Koi data nahi</div>'}</div>
 <div class="card"><h2>Top Selling Items</h2>${top.length?`<table><tr><th>Item</th><th class="n">Qty sold</th></tr>
 ${top.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${inr(x[1])}</td></tr>`).join('')}
 </table>`:'<div class="em">Koi item nahi</div>'}</div>`;
}
function exportCSV(){
 const a=D.bills.filter(b=>!b._del&&b.date>=RF.from&&b.date<=RF.to).sort((x,y)=>x.ts-y.ts);
 const h=['Bill No','Date','Customer','Mobile','Items','Sub','Discount','CGST','SGST','Total','Paid','Due','Mode'];
 const rows=a.map(b=>[b.no,fd(b.date),b.customer_name,b.customer_mob||'',(b.items||[]).map(i=>i.name+'x'+i.qty).join('; '),b.sub,b.discount,b.cgst||0,b.sgst||0,b.total,b.paid,b.due,b.paid_mode]);
 const csv=[h].concat(rows).map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
 download('UltraAccounting_'+RF.from+'_to_'+RF.to+'.csv','\ufeff'+csv,'text/csv');
}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

  <label class="f">From<input type="date" value="${EF.from}" onchange="EF.from=this.value;drawExp()"></label>

 const a=expList(),el=$('exps');if(!el)return;const tot=a.reduce((s,e)=>s+num(e.amount),0);
 const cat={};a.forEach(e=>cat[e.category]=(cat[e.category]||0)+num(e.amount));const cs=Object.entries(cat).sort((x,y)=>y[1]-x[1]);
 el.innerHTML=`<div class="stats"><div class="stat s5"><i class="si">💸</i><b>₹ ${inr(tot)}</b><span>Total Kharcha</span></div><div class="stat s2"><i class="si">🧾</i><b>${a.length}</b><span>Entries</span></div></div>
 ${cs.length?`<div class="card"><h2>Category-wise</h2>${cs.map(([c,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(c)}</span><b>₹ ${inr(v)}</b></div><div style="height:8px;background:var(--light);border-radius:9px;overflow:hidden"><div style="height:100%;width:${v/tot*100}%;background:linear-gradient(90deg,var(--cyan),var(--navy3))"></div></div></div>`).join('')}</div>`:''}
 <div class="card">${a.length?`<div class="tw"><table><tr><th>Date</th><th>Category</th><th>Note</th><th>Mode</th><th class="n">Amount</th><th></th></tr>
 ${a.map(e=>`<tr><td>${fd(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note||'')}</td><td>${esc(e.mode||'')}</td><td class="n"><b>₹ ${inr(e.amount)}</b></td>
 <td><div class="acts"><button class="btn l s" onclick="expForm('${e.id}')">✏️ Edit</button><button class="btn r s" onclick="delExp('${e.id}')">Del</button></div></td></tr>`).join('')}</table></div>`:'<div class="em">Is period me koi kharcha nahi.</div>'}</div>`;
}
function expForm(id){

 modal(`<h2>${id?'Kharcha Edit':'Naya Kharcha'}</h2><div class="g2">

 <label class="f">Amount (₹) *<input id="x_amt" type="number" min="0" step="0.01" value="${e.amount}"></label>

 <label class="f">Mode<select id="x_mode">${['Cash','UPI / QR','Card','Cheque'].map(m=>`<option${e.mode===m?' selected':''}>${m}</option>`).join('')}</select></label>

function saveExp(id){const amt=num($('x_amt').value);if(!(amt>0)){toast('Amount daalein',true);return}

function delExp(id){const e=D.expenses.find(x=>x.id===id);if(!e||!confirm('Ye kharcha delete karein?'))return;put('expenses',Object.assign({},e,{_del:true}));log('Delete kharcha',e.category,'₹'+inr(e.amount));drawExp()}
function exportExp(){downloadCSV('Kharcha_'+EF.from+'_to_'+EF.to+'.csv',[['Date','Category','Note','Mode','Amount']].concat(expList().map(e=>[fd(e.date),e.category,e.note||'',e.mode||'',e.amount])))}

/* ========== BACKUP RESTORE ========== */
function restoreBackup(file){
 if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{
  const j=JSON.parse(rd.result);if(j.app!=='ultra-accounting'||!j.data)throw new Error('Ye UltraAccounting ka backup nahi hai');
  const st=['items','customers','bills','payments','parties','entries','expenses','suppliers','purchases'];let n=0;
  if(!confirm('Backup restore karein? Maujooda data me merge hoga (purana data delete nahi hoga).'))return;
  st.forEach(k=>(j.data[k]||[]).forEach(o=>{if(!o||!o.id)return;const cur=D[k].find(x=>x.id===o.id);if(!cur||(cur._u||0)<(o._u||0)){put(k,Object.assign({},o));n++}}));
  const m=(j.data.meta||[])[0];if(m&&m.counters){Object.keys(m.counters).forEach(c=>{M.counters[c]=Math.max(M.counters[c]||0,m.counters[c])});saveMeta()}
  toast(n+' records restore hue ✔');views.settings();
 }catch(e){toast('Restore fail: '+e.message,true)}};
 rd.readAsText(file);
}

function amountWords(n){
 n=Math.round(num(n));if(!n)return'Zero';
 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 const cr=Math.floor(n/1e7),lk=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,h=n%1000;
 return ((cr?three(cr)+' Crore ':'')+(lk?two(lk)+' Lakh ':'')+(th?two(th)+' Thousand ':'')+(h?three(h):'')).trim()+' Rupees Only';
}

 $('printArea').innerHTML=html;

}

function waBill(id){

 if(!b.customer_mob){toast('Customer ka mobile nahi hai',true);return}
 const L=['*'+S.name+'*',S.address||'',S.gst_no?'GSTIN: '+S.gst_no:'','',

 (b.items||[]).forEach((it,i)=>L.push((i+1)+'. '+it.name+' × '+it.qty+' = ₹'+inr(it.amount)));
 L.push('','*Sub Total:* ₹'+inr(b.sub));

 if(num(b.cgst)>0)L.push('*CGST 9%:* ₹'+inr(b.cgst),'*SGST 9%:* ₹'+inr(b.sgst));
 L.push('*Net Total:* ₹'+inr(b.total),'*Paid:* ₹'+inr(b.paid));
 if(num(b.due)>0)L.push('*Due:* ₹'+inr(b.due));
 L.push('','Thank You! Visit Again 🙏','- '+S.name);
 waOpen(b.customer_mob,L);
 log('WhatsApp bill',b.no,'to '+b.customer_mob);
}

/* ========== RESET DATA FUNCTION ========== */
async function resetData(mode){
 const msg = mode === 'all' 
   ? '⚠️ WARNING: Sab kuch delete ho jayega (Bills, Items, Customers, Parties). Pakka?' 
   : 'Purane saare Bills aur Customers delete ho jayenge (Items/Stock bache rahenge). Pakka?';
   
 if(!confirm(msg)) return;
 if(!confirm('Kya aapne Backup le liya hai? (Nahi to Cancel karein)')) return;

 try {
   // 1. Server (Supabase) se delete karo
   const r = await fetch(API_BASE+'/api/reset-data', {
     method:'POST', 
     headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN}, 
     body: JSON.stringify({mode: mode})
   });
   const j = await r.json();
   if(!r.ok) throw new Error(j.error || 'Server se delete nahi hua');

   // 2. Browser (Local IndexedDB) se delete karo
   let stores = mode === 'all' 
     ? ['bills','customers','items','parties','entries','expenses','suppliers','purchases'] 
     : ['bills','customers','payments','parties','entries','expenses'];
     
   for(const st of stores){
     D[st] = [];
     await idbClear(st);
   }
   
   // 3. Naya Bill Number 1 se shuru karne ke liye
   if(mode === 'all' || mode === 'bills'){
     M.counters['bill'] = 0;
     saveMeta();
   }

   toast('✅ Data delete ho gaya!');
   render(); // Page refresh
 } catch(e) {
   toast('Delete fail: ' + e.message, true);
 }
}

/* ========== INIT ========== */
async function init(){
 idb=await openDB();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 for(const s of STORES)D[s]=await idbAll(s);
 S=D.settings[0]||{};
 M=D.meta[0]||{id:'meta',counters:{},dirty:{},lastPull:0,seeded:false,lastSync:0};
 try{
  const tk=sessionStorage.getItem('ua_token'),sh=sessionStorage.getItem('ua_shop'),us=sessionStorage.getItem('ua_user');
  if(tk&&sh&&us){TOKEN=tk;SHOP=JSON.parse(sh);ME=JSON.parse(us);
   if(S.setupDone){page='dashboard';render();syncNow();return}
  }
 }catch(e){}
 renderLogin();
 window.addEventListener('online',()=>{renderStatus();if(TOKEN)syncNow()});
 window.addEventListener('offline',renderStatus);
 setInterval(()=>{if(TOKEN)syncNow()},15000);
}
init();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
