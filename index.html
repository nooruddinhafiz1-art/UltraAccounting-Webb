<style>

<script>
window.__bootOK=false;
function __bootFail(msg){
 if(window.__bootOK||document.getElementById('bootErr'))return;
 var d=document.createElement('div');d.id='bootErr';
 d.innerHTML='<h2>App start nahi ho paya</h2><div>Ye screenshot support ko bhej dein: <b>7602292599</b></div><code></code>'+
 '<button id="be1">Dobara try karein</button><button id="be2" style="background:#B3261E">Cache saaf karke reload</button>';
 document.body.appendChild(d);d.querySelector('code').textContent=msg;
 document.getElementById('be1').onclick=function(){location.reload()};
 document.getElementById('be2').onclick=function(){
  var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(x){return x.unregister()}))}))}catch(e){}
  try{if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}))}catch(e){}
  Promise.all(p).then(function(){location.reload()},function(){location.reload()})};
}
window.addEventListener('error',function(e){__bootFail((e.message||'Error')+' ['+String(e.filename||'').split('/').pop()+':'+e.lineno+']')});
window.addEventListener('unhandledrejection',function(e){__bootFail('Promise: '+((e.reason&&e.reason.message)||e.reason))});
setTimeout(function(){__bootFail('App 12 second me start nahi hua. Internet / server check karein, ya neeche se cache saaf karein.')},12000);
</script>

const I18N={d:Object.create(null),p:[]};
I18N_RAW.split('\n').forEach(l=>{if(!l)return;const a=l.split('|');if(a.length<3)return;
 if(a[0].startsWith('re:')){try{I18N.p.push([new RegExp(a[0].slice(3)),a[1],a[2],a[3]||''])}catch(e){}}
 else I18N.d[a[0]]={en:a[1]||a[0],bn:a[2]||a[1]||a[0],hi:a[3]||''}});
function trInfo(core){const h=I18N.d[core];if(h)return h;
 for(const x of I18N.p){if(x[0].test(core))return{en:core.replace(x[0],x[1]),bn:core.replace(x[0],x[2]),hi:x[3]?core.replace(x[0],x[3]):'',pat:true}}return null}
function trFull(v){const m=v.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core||!/[A-Za-z]/.test(core))return null;
 let info=trInfo(core),lead='';
 if(!info){const mm=core.match(/^([^A-Za-z0-9]+)([\s\S]+)$/);if(mm){info=trInfo(mm[2]);lead=mm[1]}}
 return info?{pre:m[1]+lead,post:m[3],info}:null}
const SKIP_SEL='#printArea,script,style,.l2,textarea,input,#bootErr,#toast';
const DECO_TAGS={BUTTON:1,LABEL:1,TH:1,H1:1,H2:1,H3:1,H4:1,LEGEND:1};
function canDeco(p){if(p.closest('td,.chip,.bdg,#toast,option'))return false;return !!DECO_TAGS[p.nodeName]||p.matches('.stat span,.em,.hint,.tabs small')}
function trText(t){
 const p=t.parentNode;if(!p||p.nodeType!==1||p.closest(SKIP_SEL))return;
 const v=t.nodeValue;if(!v||!/[A-Za-z]/.test(v))return;
 const r=trFull(v);if(!r)return;
 if(p.closest('td')&&!r.info.pat&&!p.classList.contains('bdg')&&!p.classList.contains('muted'))return; // table data cells: sirf patterns
 const en=r.pre+r.info.en+r.post;
 if(en!==v){if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',v.trim());t.nodeValue=en}
 if(LANG2&&canDeco(p)){const l2=r.info[LANG2];
  if(l2&&l2!==r.info.en){const nx=t.nextSibling;
   if(!(nx&&nx.nodeType===1&&nx.classList.contains('l2'))){const sp=document.createElement('span');sp.className='l2';sp.textContent=l2;p.insertBefore(sp,t.nextSibling)}}}}
function trAttr(e){['placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const r=trFull(v);if(r){const q=r.pre+r.info.en+r.post;if(q!==v)e.setAttribute(a,q)}}})}
function trNode(n){
 if(n.nodeType===3){trText(n);return}if(n.nodeType!==1||n.closest(SKIP_SEL))return;
 const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),arr=[];let t;while(t=w.nextNode())arr.push(t);arr.forEach(trText);
 if(n.matches&&n.matches('[placeholder],[title]'))trAttr(n);if(n.querySelectorAll)n.querySelectorAll('[placeholder],[title]').forEach(trAttr)}
new MutationObserver(ms=>{ms.forEach(m=>{if(m.type==='childList')m.addedNodes.forEach(trNode);else if(m.type==='characterData')trText(m.target)})})
 .observe(document.documentElement,{childList:true,subtree:true,characterData:true});

async function syncNow(manual){
 if(!TOKEN||!API_BASE){if(manual)toast('Login ke baad hi sync hoga',true);return}
 if(!navigator.onLine){renderStatus();if(manual)toast('Internet nahi hai',true);return}
 if(syncing)return;syncing=true;syncMsg='Syncing…';renderStatus();
 try{
  const keys=Object.keys(M.dirty);
  for(let i=0;i<keys.length;i+=100){
   const chunk=keys.slice(i,i+100),rows=[],sent={};
   chunk.forEach(k=>{const[st,id]=k.split('|');const o=(D[st]||[]).find(x=>x.id===id);if(o){rows.push({store:st,id,data:o,updated_at:o._u||1});sent[k]=o._u}else delete M.dirty[k]});
   if(rows.length){const r=await fetch(API_BASE+'/api/records',{method:'POST',headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN},body:JSON.stringify(rows)});if(r.status===401){logout();toast('Session khatam ya shop block hai — dobara login karein',true);return}if(!r.ok)throw new Error('Upload fail ('+r.status+')')}
   Object.keys(sent).forEach(k=>{const[st,id]=k.split('|');const o=D[st].find(x=>x.id===id);if(!o||o._u===sent[k])delete M.dirty[k]});
  }
  let pulled=0;
  for(let loop=0;loop<200;loop++){
   const r=await fetch(API_BASE+'/api/records?since='+(M.lastPull||0)+'&limit=500',{headers:{'X-Auth-Token':TOKEN}});
   if(r.status===401){logout();toast('Session khatam ya shop block hai — dobara login karein',true);return}if(!r.ok)throw new Error('Download fail ('+r.status+')');
   const rows=await r.json();if(!rows.length)break;
   rows.forEach(row=>{const st=row.store;if(!D[st])return;const loc=D[st].find(x=>x.id===row.id);const o=row.data;const ru=o._u||row.updated_at;o._u=ru;if(!loc||(loc._u||0)<ru){upsert(st,o);idbPut(st,o);pulled++}if(row.updated_at>(M.lastPull||0))M.lastPull=row.updated_at});
   if(rows.length<500)break;
  }
  M.lastSync=Date.now();syncMsg='';saveMeta();
  if(manual)toast(pulled?('Synced. '+pulled+' records received.'):'Synced.');
  if(pulled&&page==='dashboard')render();
 }catch(e){syncMsg='Sync error: '+(e.message||e);if(manual)toast(syncMsg,true)}
 finally{syncing=false;saveMeta();renderStatus()}
}
function renderStatus(){const el=$('status');if(!el)return;let c='ok',t;const on=navigator.onLine;
 if(!on){c='bad';t='Offline — data local me safe hai'+(pending()?' ('+pending()+' waiting)':'')}
 else if(syncMsg&&syncMsg!=='Syncing…'){c='bad';t=syncMsg.slice(0,70)}
 else if(syncing){c='warn';t='Syncing…'}
 else if(pending()){c='warn';t='Online · '+pending()+' waiting to sync'}
 else{t='Online · synced'+(M.lastSync?' '+new Date(M.lastSync).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'')}
 el.className='chip '+c;el.innerHTML='<i></i>'+esc(t)}

async function doLogin(){
 const code=$('lc').value.trim().toUpperCase(),username=$('lu').value.trim().toLowerCase(),password=$('lp').value;
 if(!code||!username||!password){$('le').textContent='Sab fields bharein';return}
 const btn=$('lbtn');btn.disabled=true;btn.textContent='Checking…';
 const wake=setTimeout(()=>{if(btn.disabled)btn.textContent='Server jaag raha hai… 30-50 sec lag sakte hain'},4000);
 try{
  const r=await fetch(API_BASE+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,username,password})});
  const j=await r.json();
  if(!r.ok){$('le').textContent=j.error||'Login fail';btn.disabled=false;btn.textContent='Login';return}
  TOKEN=j.token;SHOP=j.shop;ME=j.user;
  saveSession();try{localStorage.setItem('ua_lastcode',code);localStorage.setItem('ua_lastuser',username)}catch(e){}
  for(const s of STORES)D[s]=await idbAll(s);
  S=D.settings[0]||{};M=D.meta[0]||{id:'meta',counters:{},dirty:{},lastPull:0,seeded:false,lastSync:0};
  if(M.shop_id&&M.shop_id!==SHOP.id){
   if(pending()>0){TOKEN=null;ME=null;SHOP=null;clearSession();$('le').textContent='Is browser me doosri shop ka unsynced data hai. Pehle us shop me login karke Sync karein.';btn.disabled=false;btn.textContent='Login';return}
   for(const st of STORES){await idbClear(st);D[st]=[]}
   S={};M={id:'meta',counters:{},dirty:{},lastPull:0,seeded:false,lastSync:0};
  }
  M.shop_id=SHOP.id;saveMeta();
  D.parties=D.parties.filter(p=>(p.owner||'')===ME.id||(!p.owner&&ME.role==='admin'));D.entries=D.entries.filter(e=>(e.owner||'')===ME.id||(!e.owner&&ME.role==='admin'));
  if(!S.setupDone){
   btn.textContent='Data la rahe hain…';await syncNow();S=D.settings[0]||{};
   if(!S.setupDone&&ME.role!=='admin'){TOKEN=null;ME=null;SHOP=null;clearSession();$('le').textContent='Shop ka setup abhi pura nahi hua. Pehle owner ko login karke setup karne dein (internet chahiye).';btn.disabled=false;btn.textContent='Login';return}
  }
  if(!S.name||!S.setupDone){renderWizard();return}
  page='dashboard';render();syncNow();
 }catch(e){$('le').textContent='Network error. Internet check karein.';btn.disabled=false;btn.textContent='Login'}
 finally{clearTimeout(wake)}
}

function weekChart(){

 const mx=Math.max(1,...days.map(d=>d.v)),tot=days.reduce((a,d)=>a+d.v,0);
 return `<div class="card"><h2>📊 7 Days Sale <span class="muted" style="font-weight:500">· Total ₹${inr(tot)}</span></h2>

  <div title="₹${inr(d.v)}" style="width:100%;max-width:56px;height:${Math.max(4,d.v/mx*120)}px;border-radius:10px 10px 4px 4px;background:${d.k===ymd()?'linear-gradient(180deg,#27d2ff,#0A234B)':'linear-gradient(180deg,#b7c9e6,#8aa4cf)'}"></div>
  <span style="font-size:12px;font-weight:${d.k===ymd()?800:500};color:var(--navy)">${d.l}</span></div>`).join('')}</div></div>`;
}

const GST_RATES=[0,3,5,12,18,28];
const defGst=()=>S.gst_default==null||S.gst_default===''?18:num(S.gst_default);
const itemGst=it=>it&&it.gst!=null&&it.gst!==''?num(it.gst):defGst();
function calcTot(f){
 const gstOn=!!(S.gst_no&&f.gst_enabled);
 const L=f.items.map(it=>({amt:num(it.qty)*num(it.rate),rate:num(it.gst)}));
 const sub=L.reduce((x,l)=>x+l.amt,0);
 const disc=Math.min(Math.max(num(f.discount),0),sub);
 if(!gstOn)return{sub:r2(sub),disc:r2(disc),cgst:0,sgst:0,igst:0,lines:[],net:r2(sub-disc)};
 const k=sub>0?(sub-disc)/sub:0,by={};
 L.forEach(l=>{const a=l.amt*k;let taxable,t;
  if(f.gst_incl){taxable=a/(1+l.rate/100);t=a-taxable}else{taxable=a;t=a*l.rate/100}
  const o=by[l.rate]||(by[l.rate]={rate:l.rate,taxable:0,tax:0});o.taxable+=taxable;o.tax+=t});
 const lines=Object.values(by).sort((x,y)=>x.rate-y.rate).map(o=>{const t=r2(o.tax),h=r2(t/2);
  return{rate:o.rate,taxable:r2(o.taxable),cgst:f.igst?0:h,sgst:f.igst?0:r2(t-h),igst:f.igst?t:0}});
 const cgst=r2(lines.reduce((x,l)=>x+l.cgst,0)),sgst=r2(lines.reduce((x,l)=>x+l.sgst,0)),igst=r2(lines.reduce((x,l)=>x+l.igst,0));
 const net=f.gst_incl?sub-disc:sub-disc+cgst+sgst+igst;
 return{sub:r2(sub),disc:r2(disc),cgst,sgst,igst,lines,net:r2(net)};
}
function calc(){
 const T=calcTot(F);
 const paid=F.paidT?num(F.paid):T.net;
 const set=(i,v)=>{const e=$(i);if(e)e.textContent=v};
 set('t_sub','₹ '+inr(T.sub));set('t_disc','₹ '+inr(T.disc));
 if($('t_cgst'))set('t_cgst','₹ '+inr(T.cgst));
 if($('t_sgst'))set('t_sgst','₹ '+inr(T.sgst));
 if($('t_igst'))set('t_igst','₹ '+inr(T.igst));
 set('t_net','₹ '+inr(T.net));set('t_paid','₹ '+inr(paid));
 set('t_due','₹ '+inr(Math.max(0,T.net-paid)));
 const p=$('f_paid');if(p&&!F.paidT)p.value=T.net.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
}

const r2=n=>Math.round(num(n)*100)/100;
function adjStock(list,sign){(list||[]).forEach(l=>{if(!l.item_id)return;const it=D.items.find(x=>x.id===l.item_id);if(!it||it.qty===undefined||it.qty===null)return;put('items',Object.assign({},it,{qty:r2(num(it.qty)-sign*num(l.qty))}))})}

 closeModal();
 F={id:null,editId:b.id,editNo:b.no,customer_id:b.customer_id||null,customer_name:b.customer_name||'',customer_mob:b.customer_mob||'',customer_addr:b.customer_addr||'',
  items:(b.items||[]).map(i=>({item_id:i.item_id||null,name:i.name,qty:num(i.qty),rate:num(i.rate),cost:num(i.cost||0),gst:i.gst==null?defGst():num(i.gst),hsn:i.hsn||'',batch:i.batch||'',expiry:i.expiry||'',serial:i.serial||'',warranty:num(i.warranty)||0})),
  discount:b.discount||0,paid:num(b.paid),paidT:true,mode:b.paid_mode||'Cash',notes:b.notes||'',date:b.date,gst_enabled:!!b.gst_enabled,gst_incl:!!b.gst_incl,igst:!!b.inter,cust_gstin:b.cust_gstin||''};

function saveBill(action){
 if(!F.customer_name.trim()){toast('Customer ka naam likhein',true);return}
 if(!F.items.length){toast('Kam se kam ek item add karein',true);return}
 if(F.items.some(it=>!(num(it.qty)>0))){toast('Har item ki quantity 0 se zyada honi chahiye',true);return}
 if(!F.date){toast('Bill date chunein',true);return}
 const old=F.editId?D.bills.find(x=>x.id===F.editId):null;
 if(F.editId&&(!old||old._del)){toast('Ye bill ab maujood nahi hai',true);return}
 const T=calcTot(F),paid=r2(F.paidT?num(F.paid):T.net);
 if(paid<0||paid>T.net+0.01){toast(F.editId?'Paid amount naye total se zyada hai — Paid kam karein':'Paid amount galat hai',true);return}
 let cid=F.customer_id;
 if(!cid||!D.customers.some(c=>c.id===cid)){
  const exist=D.customers.find(c=>F.customer_mob&&c.mob===F.customer_mob&&c.name.toLowerCase()===F.customer_name.toLowerCase());
  if(exist)cid=exist.id;
  else{const c={id:uid(),name:F.customer_name.trim(),mob:F.customer_mob.trim(),addr:F.customer_addr.trim(),created:ymd()};put('customers',c);cid=c.id}
 }
 const common={date:F.date,customer_id:cid,customer_name:F.customer_name.trim(),customer_mob:F.customer_mob.trim(),customer_addr:F.customer_addr.trim(),
  items:F.items.map(it=>({item_id:it.item_id,name:it.name,qty:num(it.qty),rate:num(it.rate),cost:num(it.cost||0)||null,gst:num(it.gst),hsn:it.hsn||'',batch:it.batch||'',expiry:it.expiry||'',serial:(it.serial||'').trim(),warranty:num(it.warranty)||0,amount:r2(num(it.qty)*num(it.rate))})),
  sub:T.sub,discount:T.disc,cgst:T.cgst,sgst:T.sgst,igst:T.igst,tax_lines:T.lines,gst_incl:!!(S.gst_no&&F.gst_enabled&&F.gst_incl),inter:!!(S.gst_no&&F.gst_enabled&&F.igst),cust_gstin:(F.cust_gstin||'').trim(),total:T.net,paid,paid_mode:F.mode,due:r2(T.net-paid),notes:F.notes,
  gst_enabled:!!(S.gst_no&&F.gst_enabled),gst_no:S.gst_no||''};
 let b;
 if(old){
  b=Object.assign({},old,common,{edited_by:ME.name,edited_at:Date.now(),edit_count:(old.edit_count||0)+1});
  put('bills',b);
  if(old.stock_done){adjStock(old.items,-1);adjStock(b.items,1)}
  const diff=r2(paid-num(old.paid));
  if(Math.abs(diff)>=0.01)put('payments',{id:uid(),bill_id:b.id,bill_no:b.no,date:ymd(),ts:Date.now(),amount:diff,mode:diff>0?F.mode:'Adjustment',note:'Bill edit',customer:cid,by:ME.name,by_id:ME.id});
  log('Edit bill',b.no,`₹${inr(old.total)} → ₹${inr(T.net)}`);
  toast('Bill update ho gaya: '+b.no);
 }else{
  const no=`${S.bill_prefix}-${ymd().slice(0,4)}-${pad(nextSeq('bill'),4)}`;
  b=Object.assign({id:uid(),no,ts:Date.now(),created_by:ME.name,created_by_id:ME.id,stock_done:true},common);
  put('bills',b);adjStock(b.items,1);
  if(paid>0)put('payments',{id:uid(),bill_id:b.id,bill_no:b.no,date:ymd(),ts:Date.now(),amount:paid,mode:F.mode,customer:cid,by:ME.name,by_id:ME.id});
  if(F.estId){const e=D.estimates.find(x=>x.id===F.estId);if(e)put('estimates',Object.assign({},e,{status:'converted',bill_no:b.no}))}
  log('Create bill',b.no,`₹${inr(T.net)}`);
  toast('Bill save ho gaya: '+b.no);
 }
 if(action==='wa')waBill(b.id);
 else if(action===true)printBill(b.id,'receipt');
 if(old){F=null;page='bills';render()}else{F=newBill();drawBilling()}
}

   <label class="f" style="grid-column:1/-1">Wholesaler *<select id="pu_sup">${sups.map(s=>`<option value="${s.id}"${s.id===supId?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
   <label class="f" style="grid-column:1/-1">Item * (Stock me add hoga)<select id="pu_item">${items.map(i=>`<option value="${i.id}">${esc(i.name)} (Stock: ${i.qty||0})</option>`).join('')}<option value="new">-- Naya Item Banao --</option></select></label>
   
   <div id="new_item_fields" style="display:none;grid-column:1/-1;background:var(--light);padding:10px;border-radius:8px;">
     <label class="f">Naya Item Name<input id="pu_new_name"></label>
   </div>

   <label class="f">Quantity *<input id="pu_qty" type="number" step="0.01" value="1"></label>
   <label class="f">Purchase Rate (₹) *<input id="pu_rate" type="number" step="0.01"></label>
   <label class="f">Total Amount<input id="pu_total" readonly style="background:#eee;font-weight:bold"></label>
   <label class="f">Paid Amount (₹)<input id="pu_paid" type="number" step="0.01" value="0"></label>
   <label class="f">Due (Dena)<input id="pu_due" readonly style="background:#eee;font-weight:bold;color:var(--red)"></label>
   <label class="f">Date<input id="pu_date" type="date" value="${ymd()}"></label>
  </div>
  <div class="mfoot"><button class="btn l" onclick="closeModal()">Cancel</button><button class="btn g" onclick="savePurchase()">Import to Stock</button></div>`);

 const calc=()=>{
   const tot=r2(num($('pu_qty').value)*num($('pu_rate').value));
   const due=r2(tot-num($('pu_paid').value));
   $('pu_total').value=tot; $('pu_due').value=due;
 };
 $('pu_qty').oninput=calc; $('pu_rate').oninput=calc; $('pu_paid').oninput=calc;
 $('pu_item').onchange=(e)=>{
   if(e.target.value==='new'){$('new_item_fields').style.display='block';$('pu_rate').value='';}
   else{$('new_item_fields').style.display='none';const it=items.find(x=>x.id===e.target.value);if(it&&it.cost)$('pu_rate').value=it.cost;}
   calc();
 };
}

function savePurchase(){
 const supId=$('pu_sup').value, sup= D.suppliers.find(x=>x.id===supId);
 let itemId=$('pu_item').value, itemName='', unit='pcs';
 
 if(itemId==='new'){
   itemName=$('pu_new_name').value.trim();
   if(!itemName){toast('Item ka naam likhein',true);return}
   itemId=uid();
   put('items',{id:itemId,name:itemName,qty:0,rate:0,cost:0,created:ymd()});
 } else {
   const it=D.items.find(x=>x.id===itemId);
   itemName=it.name; unit=it.unit||'pcs';
 }

 const qty=num($('pu_qty').value), rate=num($('pu_rate').value), paid=num($('pu_paid').value);
 const total=r2(qty*rate), due=r2(total-paid);
 
 if(qty<=0||rate<=0){toast('Qty aur Rate sahi daalein',true);return}
 if(paid>total){toast('Paid amount total se zyada nahi ho sakta',true);return}

 put('purchases',{
   id:uid(), ts:Date.now(), date:$('pu_date').value,
   supplier_id:supId, sup_name:sup.name, item_id:itemId, item_name:itemName,
   qty, rate, total, paid, due, unit
 });

 const it=D.items.find(x=>x.id===itemId);
 if(it){
   it.qty = r2(num(it.qty) + qty);
   const oldQty = num(it.qty) - qty;
   const oldCost = num(it.cost) || 0;
   const newCost = (oldQty * oldCost + total) / (oldQty + qty);
   it.cost = r2(newCost);
   put('items', it);
 }

 log('Import Stock', itemName, `₹${total} from ${sup.name}`);
 toast('Stock import ho gaya ✔');
 closeModal(); views.purchases();
}

function paySup(supId){

   id:uid(), ts:Date.now(), date:ymd(), supplier_id:supId,
   sup_name:D.suppliers.find(x=>x.id===supId).name,
   item_name:'💵 Payment Adjustment', qty:0, rate:0, total:0, paid:amt, due:-amt
 });

}

let BF={from:'',to:'',q:'',due:false,by:''};
function statGo(k){const td=ymd();
 if(k==='bills'||k==='todaydue'){BF={from:td,to:td,q:'',due:k==='todaydue',by:''};nav('bills')}
 else if(k==='due')nav('due');else if(k==='cust')nav('customers')}
views.bills=function(){

 $('view').innerHTML=`<div class="card"><div class="row">
 <label class="f">From<input type="date" value="${BF.from}" onchange="BF.from=this.value;drawBills()"></label>
 <label class="f">To<input type="date" value="${BF.to}" onchange="BF.to=this.value;drawBills()"></label>
 <label class="f" style="flex:1;min-width:200px">Search<input value="${esc(BF.q)}" placeholder="Bill no, customer, mobile" oninput="BF.q=this.value;drawBills()"></label>
 <button class="btn l s" onclick="BF.from=ymd();BF.to=ymd();drawBills()">Today</button>
 <button class="btn l s" onclick="BF.from='2000-01-01';BF.to='2999-12-31';drawBills()">All</button>
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-size:13px;font-weight:600;color:var(--navy)"><input type="checkbox" style="width:auto;margin:0" ${BF.due?'checked':''} onchange="BF.due=this.checked;drawBills()"> Only pending due</label>

  ${BF.by?`<button class="btn s" onclick="BF.by='';views.bills()">Staff: ${esc(BF.by)} ✕</button>`:''}

};
function billBadge(b){const d=num(b.due);if(d<=0.009)return'<span class="bdg ok">Paid</span>';return num(b.paid)>0?'<span class="bdg warn">Partial</span>':'<span class="bdg bad">Unpaid</span>'}
function drawBills(){
 const q=BF.q.trim().toLowerCase();
 const a=D.bills.filter(b=>!b._del&&b.date>=BF.from&&b.date<=BF.to&&(!q||(b.no+' '+b.customer_name+' '+(b.customer_mob||'')+' '+(b.items||[]).map(i=>i.serial||'').join(' ')).toLowerCase().includes(q))&&(!BF.due||num(b.due)>0.009)&&(!BF.by||b.created_by===BF.by)).sort((x,y)=>y.ts-x.ts);
 const el=$('btable');if(!el)return;
 if(!a.length){el.innerHTML='<div class="em">Koi bill nahi mila.</div>';return}
 const sum=a.reduce((s,b)=>({t:s.t+num(b.total),p:s.p+num(b.paid),d:s.d+num(b.due)}),{t:0,p:0,d:0});
 el.innerHTML=`<div class="muted" style="margin-bottom:8px"><b>${a.length}</b> bills · Total <b>₹${inr(sum.t)}</b> · Paid <b>₹${inr(sum.p)}</b> · Due <b style="color:var(--red)">₹${inr(sum.d)}</b></div>
 <div class="tw"><table><tr><th>Bill No.</th><th>Date</th><th>Customer</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Due</th><th>Status</th><th>Actions</th></tr>
 ${a.slice(0,400).map(b=>`<tr><td><b>${esc(b.no)}</b>${b.edit_count?'<br><span class="muted">edited</span>':''}</td><td>${fd(b.date)}</td>
 <td>${esc(b.customer_name)}<br><span class="muted">${esc(b.customer_mob||'')}</span></td>
 <td class="n">₹ ${inr(b.total)}</td><td class="n">₹ ${inr(b.paid)}</td>
 <td class="n" style="color:${num(b.due)>0?'var(--red)':'inherit'}">₹ ${inr(b.due)}</td><td>${billBadge(b)}</td>
 <td><div class="acts"><button class="btn l s" onclick="viewBill('${b.id}')">View</button>
 ${canEdit()?`<button class="btn s" onclick="editBill('${b.id}')">✏️ Edit</button>`:''}${(fOn('returns')&&canEdit())?`<button class="btn o s" onclick="returnForm('${b.id}')">↩ Return</button>`:''}
 ${num(b.due)>0&&can('receive')?`<button class="btn o s" onclick="payDue('${b.id}')">Receive</button>`:''}
 <button class="btn l s" onclick="waBill('${b.id}')">WA</button>
 ${can('bill_delete')?`<button class="btn r s" onclick="delBill('${b.id}')">Del</button>`:''}</div></td></tr>`).join('')}
 </table></div>`;
}
function viewBill(id){const b=D.bills.find(x=>x.id===id);if(!b)return;
 modal(`<h2>Bill ${esc(b.no)}</h2>
 <div style="border:1px solid var(--line);padding:12px;border-radius:6px;overflow:auto;max-height:70vh">${billHTML(b)}</div>
 <div class="mfoot"><button class="btn l" onclick="closeModal()">Close</button>
 <button class="btn" style="background:#1da851" onclick="waBill('${b.id}')">WhatsApp</button>
 ${canEdit()?`<button class="btn" onclick="editBill('${b.id}')">✏️ Edit</button>`:''}${(fOn('returns')&&canEdit())?`<button class="btn o" onclick="returnForm('${b.id}')">↩ Return</button>`:''}<button class="btn g" onclick="printBill('${b.id}','receipt')">Print</button></div>`,true);
}
function payDue(id){if(!can('receive')){toast('Permission nahi hai',true);return}const b=D.bills.find(x=>x.id===id);if(!b)return;
 const v=prompt('Bill '+b.no+' — Due ₹'+inr(b.due)+'\nAmount received:',b.due);
 if(v===null)return;const a=num(v);if(a<=0||a>b.due){toast('Galat amount',true);return}
 const n=Object.assign({},b);n.paid=num(b.paid)+a;n.due=num(b.due)-a;
 put('bills',n);
 put('payments',{id:uid(),bill_id:b.id,bill_no:b.no,date:ymd(),ts:Date.now(),amount:a,mode:'Cash',customer:b.customer_id,by:ME.name,by_id:ME.id});
 log('Due received',b.no,'₹'+inr(a));
 toast('₹ '+inr(a)+' received');
 if(page==='bills')drawBills();else if(page==='due')drawDue();
}
function delBill(id){if(!can('bill_delete')){toast('Permission nahi hai',true);return}const b=D.bills.find(x=>x.id===id);if(!b)return;
 const why=prompt('Delete bill '+b.no+'?\nReason (required):');if(!why||!why.trim())return;
 const n=Object.assign({},b,{_del:true,delBy:ME.name,delWhy:why.trim()});put('bills',n);if(b.stock_done)adjStock(b.items,-1);log('Delete bill',b.no,why);toast('Deleted');drawBills()}

function exportCSV(){
 const a=D.bills.filter(b=>!b._del&&b.date>=RF.from&&b.date<=RF.to).sort((x,y)=>x.ts-y.ts);
 const h=['Bill No','Date','Customer','Mobile','Items','Sub','Discount','CGST','SGST','Total','Paid','Due','Mode'];

/* ========== BARCODE (EAN-13) + LABELS + SCAN ========== */
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanCheck(d){let x=0;for(let i=0;i<12;i++)x+=(+d[i])*(i%2?3:1);return(10-x%10)%10}
function eanFull(c){c=String(c||'').replace(/\D/g,'');if(c.length===12)return c+eanCheck(c);if(c.length===13&&eanCheck(c)===+c[12])return c;return null}
function genEAN(){let c;do{let d='29';for(let i=0;i<10;i++)d+=Math.floor(Math.random()*10);c=d+eanCheck(d)}while(D.items.some(x=>x.barcode===c));return c}
function eanBits(c){const p=EAN_P[+c[0]];let b='101';for(let i=1;i<=6;i++)b+=(p[i-1]==='L'?EAN_L:EAN_G)[+c[i]];b+='01010';for(let i=7;i<=12;i++)b+=EAN_R[+c[i]];return b+'101'}

 const st=S.gst_no.slice(0,2),dmy=d=>{const p=d.split('-');return p[2]+'-'+p[1]+'-'+p[0]},fp=RF.from.slice(5,7)+RF.from.slice(0,4);

   x.qty+=sign*num(it.qty);x.txval+=sign*tx;x.val+=sign*(tx+tax);if(b.inter)x.iamt+=sign*tax;else{x.camt+=sign*tax/2;x.samt+=sign*tax/2}})};
 bills.forEach(b=>{const tl=tlOf(b),gs=(b.cust_gstin||'').trim().toUpperCase(),pos=gs.length===15?gs.slice(0,2):st;addHsn(b,1);

 const out={gstin:S.gst_no,fp,version:'GST3.0.4',hash:'hash',gt:0,cur_gt:0,

async function sapi(path,method,body){
 if(!navigator.onLine)throw new Error('Internet chahiye — staff online hi manage hota hai');
 const r=await fetch(API_BASE+path,{method:method||'GET',headers:Object.assign({'X-Auth-Token':TOKEN},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;
}

async function saveStaff(id){
 const perms=[...document.querySelectorAll('.pm:checked')].map(c=>c.value);
 const body={name:$('st_name').value.trim(),password:$('st_pw').value.trim(),perms};
 if(!body.name){$('st_err').textContent='Naam likhein';return}
 try{
  if(id){body.id=id;body.active=$('st_act').checked;await sapi('/api/staff/update','POST',body)}
  else{body.username=$('st_user').value.trim().toLowerCase();if(!body.password){$('st_err').textContent='Password daalein';return}await sapi('/api/staff','POST',body)}
  closeModal();toast('Staff save ho gaya ✔');log(id?'Edit staff':'Add staff',body.name,'');loadStaff();
  if(!id)showStaffCred(body);
 }catch(e){$('st_err').textContent=e.message}
}

const myParty=p=>!p._del&&((p.owner||'')===ME.id||(!p.owner&&ME.role==='admin'));
const myParties=()=>D.parties.filter(myParty);
const PTYPES=['Customer','Supplier','Staff','Personal','Other'];

let LQ='',LT='All',LS='All';
const pEntries=id=>D.entries.filter(e=>e.party_id===id&&!e._del);
function pBal(id){return r2(pEntries(id).reduce((s,e)=>s+(e.type==='diya'?num(e.amount):-num(e.amount)),0))}
function balTxt(b){return b>0.009?`<b style="color:var(--green)">₹ ${inr(b)} Lena</b>`:b<-0.009?`<b style="color:var(--red)">₹ ${inr(-b)} Dena</b>`:'<span class="muted">Barabar ✔</span>'}

 ${a.map(({p,b})=>{const last=pEntries(p.id).sort((x,y)=>(y.date+y.ts).localeCompare(x.date+x.ts))[0];return `<tr><td><b>${esc(p.name)}</b>${p.note?'<br><span class="muted">'+esc(p.note)+'</span>':''}</td>

 let run=0;const rows=E.map(e=>{run+=e.type==='diya'?num(e.amount):-num(e.amount);return Object.assign({},e,{run:r2(run)})}).reverse();

 modal(`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h2 style="margin:0">${PT_ICON[p.type]||''} ${esc(p.name)}</h2><div class="muted">${esc(p.type)}${p.mob?' · '+esc(p.mob):''}${p.note?' · '+esc(p.note):''}</div></div>

 ${b>0.009&&p.mob?`<button class="btn" style="background:#1da851" onclick="waParty('${id}')">WhatsApp</button>`:''}
 <button class="btn l" onclick="partyStatement('${id}')">🖨️ Print</button><button class="btn l" onclick="exportPartyEntries('${id}')">📥 Excel</button></div>

 <td class="n"><b>${e.run>0?'₹ '+inr(e.run)+' Lena':e.run<0?'₹ '+inr(-e.run)+' Dena':'—'}</b></td>
 <td><div class="acts"><button class="btn l s" onclick="entryForm('${id}','${e.type}','${e.id}')">✏️</button><button class="btn r s" onclick="delEntry('${e.id}','${id}')">🗑️</button></div></td></tr>`).join('')}</table></div>`:'<div class="em">Abhi koi entry nahi. Upar se Diya / Liya daalein.</div>'}
 <div class="mfoot" style="justify-content:space-between"><div class="acts"><button class="btn l s" onclick="partyForm('${id}')">✏️ Party edit</button><button class="btn r s" onclick="delParty('${id}')">Party delete</button></div><button class="btn l" onclick="closeModal()">Close</button></div>`,true);

 modal(`<h2>${esc(p.name)} — ${e.type==='diya'?'Diya (maine diya)':'Liya (maine liya)'}</h2>
 <div class="tabs" style="margin-bottom:10px"><button id="et_diya" class="${e.type==='diya'?'on':''}" onclick="setEType('diya')">📤 Diya<br><small class="muted">paisa de diya → unse milna hai</small></button><button id="et_liya" class="${e.type==='liya'?'on':''}" onclick="setEType('liya')">📥 Liya<br><small class="muted">paisa le liya → unko dena hai</small></button></div>
 <input type="hidden" id="e_type" value="${e.type}">

 <div class="mfoot"><button class="btn l" onclick="partyView('${pid}')">Cancel</button><button class="btn g" onclick="saveEntry('${pid}','${eid||''}')">Save</button></div>`);

function setEType(t){$('e_type').value=t;$('et_diya').className=t==='diya'?'on':'';$('et_liya').className=t==='liya'?'on':''}
function saveEntry(pid,eid){
 const amt=num($('e_amt').value);if(!(amt>0)){toast('Amount 0 se zyada daalein',true);return}
 const o=Object.assign({id:eid||uid(),ts:Date.now()},eid?D.entries.find(x=>x.id===eid):{},{owner:ME.id,party_id:pid,account_id:($('e_acc')||{}).value||'',type:$('e_type').value,amount:r2(amt),date:$('e_date').value||ymd(),note:$('e_note').value.trim()});
 put('entries',o);const p=D.parties.find(x=>x.id===pid);log(eid?'Edit entry':'Add entry',p?p.name:'',(o.type==='diya'?'Diya ':'Liya ')+'₹'+inr(amt));
 toast('Entry save ho gayi ✔');if(page==='ledger')views.ledger();else if(page==='dashboard')render();partyView(pid);
}
function delEntry(eid,pid){const e=D.entries.find(x=>x.id===eid);if(!e||!confirm('Ye entry (₹'+inr(e.amount)+') delete karein?'))return;
 put('entries',Object.assign({},e,{_del:true}));log('Delete entry',pid,'₹'+inr(e.amount));if(page==='ledger')views.ledger();partyView(pid)}
function delParty(id){const p=D.parties.find(x=>x.id===id);if(!p||!confirm(p.name+' aur uski saari entries delete karein?'))return;

function partyStatement(id){const p=D.parties.find(x=>x.id===id);if(!p)return;
 const E=pEntries(id).sort((x,y)=>(x.date+String(x.ts)).localeCompare(y.date+String(y.ts)));let run=0;

 <div class="rtitle">ACCOUNT STATEMENT — ${esc(p.name)}</div><div class="rmeta"><table><tr><td><b>Party:</b></td><td>${esc(p.name)} (${esc(p.type)})</td></tr><tr><td><b>Mobile:</b></td><td>${esc(p.mob||'')}</td></tr></table><table><tr><td><b>Date:</b></td><td>${fd(ymd())}</td></tr></table></div>
 <table class="items"><thead><tr><th>Date</th><th>Note</th><th style="text-align:right">Diya</th><th style="text-align:right">Liya</th><th style="text-align:right">Balance</th></tr></thead><tbody>
 ${E.map(e=>{run+=e.type==='diya'?num(e.amount):-num(e.amount);return `<tr><td>${fd(e.date)}</td><td>${esc(e.note||'')}</td><td style="text-align:right">${e.type==='diya'?num(e.amount).toFixed(2):''}</td><td style="text-align:right">${e.type==='liya'?num(e.amount).toFixed(2):''}</td><td style="text-align:right">${Math.abs(run).toFixed(2)} ${run>0.009?'Lena':run<-0.009?'Dena':''}</td></tr>`}).join('')}</tbody></table>
 <div class="rbot"><div></div><table class="rtot"><tr class="net"><td>Net Balance:</td><td>₹ ${Math.abs(run).toFixed(2)} ${run>0.009?'(Lena)':run<-0.009?'(Dena)':''}</td></tr></table></div></div>`)}
function exportParties(){
 const rows=myParties().map(p=>{const b=pBal(p.id);return [p.name,p.type,p.mob||'',b>0?b:'',b<0?-b:'',p.note||'']});
 downloadCSV('LenaDena_'+ymd()+'.csv',[['Party','Type','Mobile','Lena (milna hai)','Dena (dena hai)','Note']].concat(rows))}
function exportPartyEntries(id){const p=D.parties.find(x=>x.id===id);if(!p)return;let run=0;
 downloadCSV('Khata_'+p.name.replace(/\W+/g,'_')+'_'+ymd()+'.csv',[['Date','Note','Diya','Liya','Balance (+Lena / -Dena)']].concat(pEntries(id).sort((x,y)=>(x.date+x.ts).localeCompare(y.date+y.ts)).map(e=>{run+=e.type==='diya'?num(e.amount):-num(e.amount);return [fd(e.date),e.note||'',e.type==='diya'?e.amount:'',e.type==='liya'?e.amount:'',r2(run)]})))}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');download(name,'\ufeff'+csv,'text/csv')}

/* ========== KHARCHA (expenses) ========== */
const ECATS=['Dukan Kiraya','Salary / Mazdoori','Bijli / Paani','Transport / Bhada','Chai-Nashta','Maal Kharid','Repair','Mobile / Internet','Other'];
let EF={from:'',to:'',cat:'All'};
views.expenses=function(){
 if(!EF.from){const d=new Date();EF.from=ymd(new Date(d.getFullYear(),d.getMonth(),1));EF.to=ymd()}
 $('view').innerHTML=`<div class="card"><div class="row">
  <label class="f">From<input type="date" value="${EF.from}" onchange="EF.from=this.value;drawExp()"></label>
  <label class="f">To<input type="date" value="${EF.to}" onchange="EF.to=this.value;drawExp()"></label>
  <label class="f">Category<select onchange="EF.cat=this.value;drawExp()">${['All'].concat(ECATS).map(c=>`<option${EF.cat===c?' selected':''}>${c}</option>`).join('')}</select></label>
  <button class="btn l s" onclick="EF.from=ymd();EF.to=ymd();views.expenses()">Aaj</button>
  <button class="btn l s" onclick="EF.from='';views.expenses()">Is mahine</button>
  <button class="btn g" onclick="expForm()">+ Kharcha</button><button class="btn l" onclick="exportExp()">📥 Excel</button></div></div><div id="exps"></div>`;
 drawExp();
};
const expList=()=>D.expenses.filter(e=>!e._del&&e.date>=EF.from&&e.date<=EF.to&&(EF.cat==='All'||e.category===EF.cat)).sort((x,y)=>(y.date+y.ts).localeCompare(x.date+x.ts));
function drawExp(){
 const a=expList(),el=$('exps');if(!el)return;const tot=a.reduce((s,e)=>s+num(e.amount),0);
 const cat={};a.forEach(e=>cat[e.category]=(cat[e.category]||0)+num(e.amount));const cs=Object.entries(cat).sort((x,y)=>y[1]-x[1]);

function restoreBackup(file){
 if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{
  const j=JSON.parse(rd.result);if(j.app!=='ultra-accounting'||!j.data)throw new Error('Ye UltraAccounting ka backup nahi hai');
  const st=['items','customers','bills','payments','parties','entries','expenses','suppliers','purchases'];let n=0;
  if(!confirm('Backup restore karein? Maujooda data me merge hoga (purana data delete nahi hoga).'))return;
  st.forEach(k=>(j.data[k]||[]).forEach(o=>{if(!o||!o.id)return;const cur=D[k].find(x=>x.id===o.id);if(!cur||(cur._u||0)<(o._u||0)){put(k,Object.assign({},o));n++}}));
  const m=(j.data.meta||[])[0];if(m&&m.counters){Object.keys(m.counters).forEach(c=>{M.counters[c]=Math.max(M.counters[c]||0,m.counters[c])});saveMeta()}
  toast(n+' records restore hue ✔');views.settings();
 }catch(e){toast('Restore fail: '+e.message,true)}};
 rd.readAsText(file);
}

let CF={from:'',to:''};
const payerOf=p=>{if(p.by)return p.by;const b=D.bills.find(x=>x.id===p.bill_id);return(b&&b.created_by)||'—'};
const payBucket=p=>{const m=String(p.mode||'Cash');return m==='Cash'?'cash':(m==='Adjustment'?'other':'digital')};
function staffStats(from,to){
 const rows={},R=n=>rows[n]||(rows[n]={name:n,bills:0,sale:0,disc:0,cash:0,digital:0,other:0,pending:0,cashAll:0,handed:0});
 D.bills.filter(b=>!b._del&&b.date>=from&&b.date<=to).forEach(b=>{const x=R(b.created_by||'—');x.bills++;x.sale+=num(b.total);x.disc+=num(b.discount);x.pending+=num(b.due)});
 D.payments.forEach(p=>{if(p._del)return;const n=payerOf(p),k=payBucket(p);if(p.date>=from&&p.date<=to)R(n)[k]+=num(p.amount);if(k==='cash')R(n).cashAll+=num(p.amount)});
 D.handovers.filter(h=>!h._del).forEach(h=>{R(h.staff).handed+=num(h.amount)});
 const out=Object.values(rows);out.forEach(x=>{['sale','disc','cash','digital','other','pending','cashAll','handed'].forEach(k=>x[k]=r2(x[k]));x.inHand=r2(x.cashAll-x.handed)});
 return out.sort((a,b)=>b.sale-a.sale||b.inHand-a.inHand);
}

function exportSalesReg(){
 const a=caBills(),rates=[...new Set(a.flatMap(b=>(b.tax_lines||[]).map(l=>l.rate)))].sort((x,y)=>x-y);
 const head=['Invoice No','Date','Customer','Customer GSTIN','Type','Supply','Taxable Value','CGST','SGST','IGST','Total Tax','Invoice Value','Paid','Due','Payment Mode','Created By'];
 rates.forEach(x=>head.push('Taxable @'+x+'%','Tax @'+x+'%'));
 const rows=a.map(b=>{const g=!!b.gst_enabled,tl=b.tax_lines&&b.tax_lines.length?b.tax_lines:(g?[{rate:18,taxable:r2(num(b.sub)-num(b.discount)),cgst:num(b.cgst),sgst:num(b.sgst),igst:num(b.igst)}]:[]);
  const taxable=g?tl.reduce((x,l)=>x+num(l.taxable),0):num(b.total);
  const row=[b.no,fd(b.date),b.customer_name,b.cust_gstin||'',g?'GST Tax Invoice':'Bill of Supply / Cash Memo',g?(b.inter?'Inter-state':'Intra-state'):'',r2(taxable),num(b.cgst),num(b.sgst),num(b.igst),r2(num(b.cgst)+num(b.sgst)+num(b.igst)),num(b.total),num(b.paid),num(b.due),b.paid_mode||'',b.created_by||''];
  rates.forEach(x=>{const l=tl.find(y=>y.rate===x);row.push(l?l.taxable:'',l?r2(num(l.cgst)+num(l.sgst)+num(l.igst)):'')});return row});
 D.returns.filter(c=>!c._del&&c.date>=RF.from&&c.date<=RF.to).forEach(c=>{const g=!!c.gst_enabled,tl=c.tax_lines||[],taxable=g?tl.reduce((x,l)=>x+num(l.taxable),0):num(c.total);
  const row=[c.no,fd(c.date),c.customer_name,c.cust_gstin||'','Credit Note (against '+c.bill_no+')',g?(c.inter?'Inter-state':'Intra-state'):'',-r2(taxable),-num(c.cgst),-num(c.sgst),-num(c.igst),-r2(num(c.cgst)+num(c.sgst)+num(c.igst)),-num(c.total),0,0,c.mode||'',c.by||''];
  rates.forEach(x=>{const l=tl.find(y=>y.rate===x);row.push(l?-l.taxable:'',l?-r2(num(l.cgst)+num(l.sgst)+num(l.igst)):'')});rows.push(row)});
 const tot=['TOTAL','','','','','',0,0,0,0,0,0,0,0,'',''];rows.forEach(rw=>{for(let i=6;i<=13;i++)tot[i]=r2(tot[i]+num(rw[i]))});
 downloadCSV('Sales_Register_'+RF.from+'_to_'+RF.to+'.csv',[head].concat(rows,[tot]));

function exportHSN(){

  (b.items||[]).forEach(it=>{const rate=it.gst==null?18:num(it.gst),a=num(it.amount)*k,taxable=b.gst_incl?a/(1+rate/100):a,tax=taxable*rate/100;
   const key=(it.hsn||'')+'|'+rate+'|'+it.name,x=m[key]||(m[key]={hsn:it.hsn||'',name:it.name,rate,qty:0,taxable:0,cgst:0,sgst:0,igst:0});

 downloadCSV('HSN_Summary_'+RF.from+'_to_'+RF.to+'.csv',[['HSN/SAC','Item','GST Rate','Quantity','Taxable Value','CGST','SGST','IGST','Total Tax']].concat(rows));

  ${(b.items||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.name)}${it.serial?`<br><small>IMEI/SN: ${esc(it.serial)}${it.warranty?' · Warranty: '+it.warranty+' months (till '+fd(warrantyTill(b.date,it.warranty))+')':''}</small>`:''}${it.batch?`<br><small>Batch: ${esc(it.batch)}${it.expiry?' · Exp: '+fd(it.expiry):''}</small>`:''}</td>${isGst?`<td>${esc(it.hsn||'')}</td>`:''}<td ${R}>${it.qty}</td><td ${R}>${num(it.rate).toFixed(2)}</td>${isGst?`<td ${R}>${it.gst==null?'':num(it.gst)+'%'}</td>`:''}<td ${R}>${num(it.amount).toFixed(2)}</td></tr>`).join('')}
  </tbody></table>
  ${isGst?`<table class="items" style="margin-top:8px"><thead><tr><th>GST %</th><th ${R}>Taxable Value</th>${b.inter?`<th ${R}>IGST</th>`:`<th ${R}>CGST</th><th ${R}>SGST</th>`}<th ${R}>Total Tax</th></tr></thead><tbody>
  ${tl.map(l=>`<tr><td>${l.rate}%</td><td ${R}>${num(l.taxable).toFixed(2)}</td>${b.inter?`<td ${R}>${num(l.igst).toFixed(2)}</td>`:`<td ${R}>${num(l.cgst).toFixed(2)}</td><td ${R}>${num(l.sgst).toFixed(2)}</td>`}<td ${R}>${(num(l.cgst)+num(l.sgst)+num(l.igst)).toFixed(2)}</td></tr>`).join('')}</tbody></table>`:''}
  <div class="rbot"><div><b>Amount in words:</b> ${esc(amountWords(b.total))}${b.gst_incl&&isGst?'<br><span style="font-size:11px">(Prices are inclusive of GST)</span>':''}</div>
  <table class="rtot">
   <tr><td>Sub Total:</td><td>₹ ${num(b.sub).toFixed(2)}</td></tr>
   ${b.discount>0?`<tr><td>Discount:</td><td>- ₹ ${num(b.discount).toFixed(2)}</td></tr>`:''}
   ${isGst&&!b.gst_incl?(b.inter?`<tr><td>IGST:</td><td>₹ ${num(b.igst).toFixed(2)}</td></tr>`:`<tr><td>CGST:</td><td>₹ ${num(b.cgst).toFixed(2)}</td></tr><tr><td>SGST:</td><td>₹ ${num(b.sgst).toFixed(2)}</td></tr>`):''}
   <tr class="net"><td>Net Total:</td><td>₹ ${num(b.total).toFixed(2)}</td></tr>
   ${b.hide_pay?'':`<tr><td>Paid:</td><td>₹ ${num(b.paid).toFixed(2)}</td></tr>
   <tr><td>Due:</td><td>₹ ${num(b.due).toFixed(2)}</td></tr>`}
  </table></div>
  ${upiBlock(b)}<div class="rnote">Thank You! Visit Again · For queries: ${esc(S.mobile||HELP_PHONE)}</div>
 </div>`;
}
function amountWords(n){
 n=Math.round(num(n));if(!n)return'Zero';
 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
 const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 const cr=Math.floor(n/1e7),lk=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,h=n%1000;
 return ((cr?three(cr)+' Crore ':'')+(lk?two(lk)+' Lakh ':'')+(th?two(th)+' Thousand ':'')+(h?three(h):'')).trim()+' Rupees Only';
}

};
const waHead=()=>['*'+(S.name||'')+'*'].concat(S.address?[S.address]:[],['']);
function waBuild(kind,lang,x){
 const t=WA_T[lang]||WA_T.en;let L=waHead();
 if(kind==='due'){L.push(`${t.dear} ${x.b.customer_name},`,...t.due(x.b.customer_name,x.b.no,inr(x.b.due)),'',t.thanks)}
 else if(kind==='summary'){L=summaryLines(lang,x.d)}
 else if(kind==='party'){L.push(`${t.dear} ${x.p.name},`,...(x.bal>0?t.recv(inr(x.bal)):t.pay(inr(-x.bal))),'',t.thanks)}
 else{const b=x.b,l=t.L;
  if(S.gst_no)L.splice(L.length-1,0,'GSTIN: '+S.gst_no);
  L.push(`${t.dear} ${b.customer_name},`,t.billIntro,'');
  L.push(`*${l.no}:* ${b.no}`,`*${l.date}:* ${fd(b.date)}`,'');
  (b.items||[]).forEach((it,i)=>L.push((i+1)+'. '+it.name+' × '+it.qty+' = ₹'+inr(it.amount)));
  L.push('',`*${l.sub}:* ₹${inr(b.sub)}`);
  if(num(b.discount)>0)L.push(`*${l.disc}:* -₹${inr(b.discount)}`);
  if(num(b.igst)>0)L.push('*IGST:* ₹'+inr(b.igst));else if(num(b.cgst)>0)L.push('*CGST:* ₹'+inr(b.cgst),'*SGST:* ₹'+inr(b.sgst));
  L.push(`*${l.net}:* ₹${inr(b.total)}`,`*${l.paid}:* ₹${inr(b.paid)}`);
  if(num(b.due)>0)L.push(`*${l.due}:* ₹${inr(b.due)}`);
  L.push('',t.bye,'- '+(S.name||''))}
 return L;
}
function waChoose(kind,x,mob,logTxt){

 waSetLang(last);
}
function waSetLang(l){if(!WAC)return;WAC.lang=l;['en','bn','hi'].forEach(k=>{const e=$('wal_'+k);if(e)e.className=k===l?'on':''});
 const t=$('wa_txt');if(t)t.value=waBuild(WAC.kind,l,WAC.x).join('\n')}

 waOpen(WAC.mob,txt.split('\n'));if(WAC.log)log(WAC.log[0],WAC.log[1],WAC.log[2]||'');closeModal();WAC=null}

function waParty(id){const p=D.parties.find(x=>x.id===id);if(!p)return;const bal=pBal(id);waChoose('party',{p,bal},p.mob,['WhatsApp reminder',p.name,'₹'+inr(Math.abs(bal))])}
function waOpen(phone,lines){
 const d=String(phone||'').replace(/\D/g,'');
 const n=d.length===10?'91'+d:d;
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(lines.join('\n')),'_blank');
}


/* ========== RESET DATA FUNCTION ========== */
async function resetData(mode){
 const msg = mode === 'all' 
   ? '⚠️ WARNING: Sab kuch delete ho jayega (Bills, Items, Customers, Parties). Pakka?' 
   : 'Purane saare Bills aur Customers delete ho jayenge (Items/Stock bache rahenge). Pakka?';
   
 if(!confirm(msg)) return;
 if(!confirm('Kya aapne Backup le liya hai? (Nahi to Cancel karein)')) return;

 try {
   // 1. Server (Supabase) se delete karo
   const r = await fetch(API_BASE+'/api/reset-data', {
     method:'POST', 
     headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN}, 
     body: JSON.stringify({mode: mode})
   });
   const j = await r.json();
   if(!r.ok) throw new Error(j.error || 'Server se delete nahi hua');

   // 2. Browser (Local IndexedDB) se delete karo
   let stores = mode === 'all' 
     ? ['bills','customers','items','parties','entries','expenses','suppliers','purchases'] 
     : ['bills','customers','payments','parties','entries','expenses'];
     
   for(const st of stores){
     D[st] = [];
     await idbClear(st);
   }
   
   // 3. Naya Bill Number 1 se shuru karne ke liye
   if(mode === 'all' || mode === 'bills'){
     M.counters['bill'] = 0;
     saveMeta();
   }

   toast('✅ Data delete ho gaya!');
   render(); // Page refresh
 } catch(e) {
   toast('Delete fail: ' + e.message, true);
 }
}

 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 for(const s of STORES)D[s]=await idbAll(s);
 S=D.settings[0]||{};
 M=D.meta[0]||{id:'meta',counters:{},dirty:{},lastPull:0,seeded:false,lastSync:0};
 try{
  const tk=localStorage.getItem('ua_token'),sh=localStorage.getItem('ua_shop'),us=localStorage.getItem('ua_user');
  if(tk&&sh&&us){TOKEN=tk;SHOP=JSON.parse(sh);ME=JSON.parse(us);
   if(S.setupDone){page='dashboard';render();syncNow();return}
  }
 }catch(e){}
 renderLogin();
 window.addEventListener('online',()=>{renderStatus();if(TOKEN)syncNow()});
 window.addEventListener('offline',renderStatus);
 setInterval(()=>{if(TOKEN)syncNow()},15000);
}

 navigator.serviceWorker.register('/sw.js').then(reg=>{try{reg.update()}catch(e){}}).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!window.__swReload){window.__swReload=1;location.reload()}});
}
setInterval(()=>{if(TOKEN&&navigator.onLine)fetch(API_BASE+'/api/ping').catch(()=>{})},240000);
</script>
